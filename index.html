<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoSim 3D - Erosão Hidráulica e Partículas</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      width: 250px;
      max-height: 92vh;
      overflow-y: auto;
    }
    #ui-panel h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .section-title {
      font-weight: bold;
      color: #94a3b8;
      margin: 12px 0 6px 0;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .control-group {
      margin-bottom: 8px;
    }
    label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      color: #cbd5e1;
    }
    select, input[type="range"], button {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px;
      border-radius: 5px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="range"] {
      padding: 0;
      height: 6px;
      accent-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    button.active { background: #16a34a; }
    .hint {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h2>GeoSim 3D <span class="badge">Erosão Ativa</span></h2>

    <div class="section-title">Dinâmica Exógena (Chuva & Erosão)</div>
    <div class="btn-row">
      <button id="btnToggleSim" class="active">Pausar Simulação</button>
      <button id="btnReset">Resetar</button>
    </div>

    <div class="control-group" style="margin-top: 10px;">
      <label>Gotas/Frame: <span id="dropsVal">250</span></label>
      <input type="range" id="dropsPerFrame" min="50" max="1000" step="50" value="250">
    </div>

    <div class="control-group">
      <label>Taxa de Erosão: <span id="erosionVal">0.30</span></label>
      <input type="range" id="erosionRate" min="0.05" max="1.0" step="0.05" value="0.30">
    </div>

    <div class="control-group">
      <label>Taxa de Deposição: <span id="depoVal">0.15</span></label>
      <input type="range" id="depositionRate" min="0.01" max="0.5" step="0.01" value="0.15">
    </div>

    <div class="section-title">Relevo e Escultura</div>
    <div class="control-group">
      <label>Preset:</label>
      <select id="presetSelect">
        <option value="montanhoso">Cordilheira Jovem (V-Valleys)</option>
        <option value="planalto">Planalto / Chapada</option>
        <option value="depressao">Depressão / Bacia</option>
        <option value="planicie">Planície Aluvial</option>
      </select>
    </div>

    <div class="control-group">
      <label>Pincel: <span id="radiusVal">18</span></label>
      <select id="brushMode">
        <option value="raise">Elevar Terreno</option>
        <option value="lower">Escavar</option>
      </select>
    </div>
    <input type="range" id="brushRadius" min="5" max="40" value="18">

    <div class="hint">
      • <b>Gotas de Chuva:</b> Partículas visuais escorrem e cavam vales em V em tempo real.<br>
      • <b>Botão Esquerdo:</b> Esculpir | <b>Direito:</b> Girar
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Dimensões da Grade de Simulação ---
    const GRID_SIZE = 128;
    const WORLD_SIZE = 220;
    const CELL_SIZE = WORLD_SIZE / (GRID_SIZE - 1);

    // Buffers Topográficos
    const heightMap = new Float32Array(GRID_SIZE * GRID_SIZE);

    // Parâmetros da Simulação de Erosão Hidráulica
    const simParams = {
      running: true,
      dropsPerFrame: 250,
      maxLifetime: 35,
      inertia: 0.15,
      capacityFactor: 4.0,
      minCapacity: 0.05,
      erodeSpeed: 0.30,
      depositSpeed: 0.15,
      evaporateSpeed: 0.02,
      gravity: 4.0
    };

    // --- Cena e Renderizador ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.0025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 1000);
    camera.position.set(0, 130, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.NONE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.ROTATE
    };

    // --- Iluminação ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const sunLight = new THREE.DirectionalLight(0xfff1e6, 1.8);
    sunLight.position.set(120, 160, 90);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    scene.add(sunLight);

    // --- Geometria do Terreno com Shader Hipsométrico ---
    const geometry = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
    geometry.rotateX(-Math.PI / 2);

    const material = new THREE.MeshStandardMaterial({
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });

    material.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>\nvarying float vHeight;`
      ).replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>\nvHeight = transformed.y;`
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        `#include <common>\nvarying float vHeight;`
      ).replace(
        '#include <color_fragment>',
        `
        vec3 colorValley  = vec3(0.12, 0.38, 0.18);
        vec3 colorPlains  = vec3(0.35, 0.55, 0.25);
        vec3 colorRock    = vec3(0.48, 0.42, 0.36);
        vec3 colorSnow    = vec3(0.95, 0.96, 1.0);

        float h = clamp(vHeight / 42.0, 0.0, 1.0);
        vec3 col = colorValley;

        if (h < 0.25) {
          col = mix(colorValley, colorPlains, h / 0.25);
        } else if (h < 0.65) {
          col = mix(colorPlains, colorRock, (h - 0.25) / 0.4);
        } else {
          col = mix(colorRock, colorSnow, (h - 0.65) / 0.35);
        }

        diffuseColor = vec4(col, 1.0);
        `
      );
    };

    const terrainMesh = new THREE.Mesh(geometry, material);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    scene.add(terrainMesh);

    // --- Sistema de Partículas Visuais de Chuva ---
    const RAIN_COUNT = 3000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(RAIN_COUNT * 3);
    const rainVelocities = new Float32Array(RAIN_COUNT);

    for (let i = 0; i < RAIN_COUNT; i++) {
      rainPositions[i * 3] = (Math.random() - 0.5) * WORLD_SIZE;
      rainPositions[i * 3 + 1] = 40 + Math.random() * 80;
      rainPositions[i * 3 + 2] = (Math.random() - 0.5) * WORLD_SIZE;
      rainVelocities[i] = 1.2 + Math.random() * 1.8;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

    const rainMat = new THREE.PointsMaterial({
      color: 0x7dd3fc,
      size: 1.2,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending
    });

    const rainParticles = new THREE.Points(rainGeo, rainMat);
    scene.add(rainParticles);

    // --- Interpolação de Altura e Gradiente do Terreno ---
    function getHeightAndGradient(posX, posZ) {
      const gx = ((posX / WORLD_SIZE) + 0.5) * (GRID_SIZE - 1);
      const gz = ((posZ / WORLD_SIZE) + 0.5) * (GRID_SIZE - 1);

      const x0 = Math.floor(gx);
      const z0 = Math.floor(gz);
      const fx = gx - x0;
      const fz = gz - z0;

      if (x0 < 0 || x0 >= GRID_SIZE - 1 || z0 < 0 || z0 >= GRID_SIZE - 1) {
        return { height: 0, gradX: 0, gradZ: 0, valid: false };
      }

      const h00 = heightMap[z0 * GRID_SIZE + x0];
      const h10 = heightMap[z0 * GRID_SIZE + (x0 + 1)];
      const h01 = heightMap[(z0 + 1) * GRID_SIZE + x0];
      const h11 = heightMap[(z0 + 1) * GRID_SIZE + (x0 + 1)];

      const height = (1 - fx) * (1 - fz) * h00 +
                     fx * (1 - fz) * h10 +
                     (1 - fx) * fz * h01 +
                     fx * fz * h11;

      const gradX = (h10 - h00) * (1 - fz) + (h11 - h01) * fz;
      const gradZ = (h01 - h00) * (1 - fx) + (h11 - h10) * fx;

      return { height, gradX, gradZ, valid: true };
    }

    // --- Algoritmo de Erosão Hidráulica por Gotas ---
    function simulateDroplet() {
      // Posição inicial aleatória dentro do mundo
      let posX = (Math.random() - 0.5) * (WORLD_SIZE - 4);
      let posZ = (Math.random() - 0.5) * (WORLD_SIZE - 4);

      let dirX = 0;
      let dirZ = 0;
      let speed = 1.0;
      let water = 1.0;
      let sediment = 0.0;

      for (let step = 0; step < simParams.maxLifetime; step++) {
        const hg = getHeightAndGradient(posX, posZ);
        if (!hg.valid) break;

        // Atualiza direção com inércia e vetor de declive (gradiente negativo)
        dirX = dirX * simParams.inertia - hg.gradX * (1 - simParams.inertia);
        dirZ = dirZ * simParams.inertia - hg.gradZ * (1 - simParams.inertia);

        const len = Math.hypot(dirX, dirZ);
        if (len === 0) break;
        dirX /= len;
        dirZ /= len;

        const nextPosX = posX + dirX * CELL_SIZE * 0.8;
        const nextPosZ = posZ + dirZ * CELL_SIZE * 0.8;

        const nextHg = getHeightAndGradient(nextPosX, nextPosZ);
        if (!nextHg.valid) break;

        const deltaH = nextHg.height - hg.height;

        // Capacidade máxima de transporte da gota no instante
        const capacity = Math.max(-deltaH * speed * water * simParams.capacityFactor, simParams.minCapacity);

        // Grid index para alterar terreno
        const gx = Math.round(((posX / WORLD_SIZE) + 0.5) * (GRID_SIZE - 1));
        const gz = Math.round(((posZ / WORLD_SIZE) + 0.5) * (GRID_SIZE - 1));
        const idx = gz * GRID_SIZE + gx;

        if (sediment > capacity || deltaH > 0) {
          // Deposição de sedimentos
          const depositAmount = (deltaH > 0)
            ? Math.min(deltaH, sediment)
            : (sediment - capacity) * simParams.depositSpeed;

          sediment -= depositAmount;
          heightMap[idx] += depositAmount;
        } else {
          // Erosão do substrato
          const erodeAmount = Math.min((capacity - sediment) * simParams.erodeSpeed, -deltaH);
          sediment += erodeAmount;
          heightMap[idx] = Math.max(0, heightMap[idx] - erodeAmount);
        }

        // Atualização de velocidade e massa por gravidade e atrito
        speed = Math.sqrt(Math.max(0, speed * speed + deltaH * simParams.gravity));
        water *= (1 - simParams.evaporateSpeed);

        posX = nextPosX;
        posZ = nextPosZ;
      }
    }

    // --- Atualização da Malha Geométrica ---
    function updateTerrainMesh() {
      const pos = geometry.attributes.position;
      for (let i = 0; i < heightMap.length; i++) {
        pos.setY(i, heightMap[i]);
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    // --- Presets de Relevo ---
    function generatePreset(type) {
      const center = GRID_SIZE / 2;
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          const idx = i * GRID_SIZE + j;
          const dx = (i - center) / center;
          const dz = (j - center) / center;
          const dist = Math.hypot(dx, dz);
          let h = 0;

          if (type === 'montanhoso') {
            const n1 = Math.abs(Math.sin(i * 0.12 + j * 0.1));
            const n2 = Math.abs(Math.cos(i * 0.22 - j * 0.18));
            h = (n1 + n2 * 0.6) * 40.0;
          } else if (type === 'planalto') {
            const plateauBase = 1.0 / (1.0 + Math.exp(14.0 * (dist - 0.55)));
            h = plateauBase * 28.0 + (Math.sin(i * 0.3) * Math.cos(j * 0.3)) * 0.8;
          } else if (type === 'depressao') {
            h = Math.min(1.0, dist * 1.6) * 26.0 - 6.0;
          } else if (type === 'planicie') {
            h = (Math.sin(i * 0.08) * Math.cos(j * 0.08)) * 2.0 + 3.0;
          }

          heightMap[idx] = Math.max(0, h);
        }
      }
      updateTerrainMesh();
    }

    // --- Atualização das Partículas de Chuva ---
    function updateRain() {
      const pos = rainGeo.attributes.position.array;
      for (let i = 0; i < RAIN_COUNT; i++) {
        pos[i * 3 + 1] -= rainVelocities[i];

        // Se a gota atingir o solo ou passar do limite inferior, ela ressurge no céu
        const hg = getHeightAndGradient(pos[i * 3], pos[i * 3 + 2]);
        const groundLevel = hg.valid ? hg.height : 0;

        if (pos[i * 3 + 1] <= groundLevel) {
          pos[i * 3] = (Math.random() - 0.5) * WORLD_SIZE;
          pos[i * 3 + 1] = 60 + Math.random() * 50;
          pos[i * 3 + 2] = (Math.random() - 0.5) * WORLD_SIZE;
        }
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    // --- Pincel Manual (Raycast) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMouseDown = false;
    let brushRadius = 18;
    let brushMode = 'raise';

    function applyBrush(point) {
      const local = terrainMesh.worldToLocal(point.clone());
      const rSq = brushRadius * brushRadius;

      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          const idx = i * GRID_SIZE + j;
          const vx = (j / (GRID_SIZE - 1) - 0.5) * WORLD_SIZE;
          const vz = (i / (GRID_SIZE - 1) - 0.5) * WORLD_SIZE;
          const dSq = (vx - local.x) ** 2 + (vz - local.z) ** 2;

          if (dSq < rSq) {
            const factor = Math.cos((Math.sqrt(dSq) / brushRadius) * (Math.PI / 2));
            if (brushMode === 'raise') heightMap[idx] += 0.8 * factor;
            if (brushMode === 'lower') heightMap[idx] = Math.max(0, heightMap[idx] - 0.8 * factor);
          }
        }
      }
      updateTerrainMesh();
    }

    window.addEventListener('pointerdown', (e) => { if (e.button === 0 && e.target === renderer.domElement) isMouseDown = true; });
    window.addEventListener('pointerup', () => { isMouseDown = false; });
    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      if (isMouseDown) {
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(terrainMesh);
        if (hits.length > 0) applyBrush(hits[0].point);
      }
    });

    // --- Interface de Controle ---
    const btnToggle = document.getElementById('btnToggleSim');
    btnToggle.addEventListener('click', () => {
      simParams.running = !simParams.running;
      btnToggle.innerText = simParams.running ? 'Pausar Simulação' : 'Retomar Simulação';
      btnToggle.className = simParams.running ? 'active' : '';
      rainParticles.visible = simParams.running;
    });

    document.getElementById('dropsPerFrame').addEventListener('input', (e) => {
      simParams.dropsPerFrame = parseInt(e.target.value);
      document.getElementById('dropsVal').innerText = e.target.value;
    });

    document.getElementById('erosionRate').addEventListener('input', (e) => {
      simParams.erodeSpeed = parseFloat(e.target.value);
      document.getElementById('erosionVal').innerText = e.target.value;
    });

    document.getElementById('depositionRate').addEventListener('input', (e) => {
      simParams.depositSpeed = parseFloat(e.target.value);
      document.getElementById('depoVal').innerText = e.target.value;
    });

    const presetSelect = document.getElementById('presetSelect');
    presetSelect.addEventListener('change', (e) => generatePreset(e.target.value));
    document.getElementById('btnReset').addEventListener('click', () => generatePreset(presetSelect.value));

    document.getElementById('brushMode').addEventListener('change', (e) => { brushMode = e.target.value; });
    document.getElementById('brushRadius').addEventListener('input', (e) => {
      brushRadius = parseFloat(e.target.value);
      document.getElementById('radiusVal').innerText = e.target.value;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Inicialização ---
    generatePreset('montanhoso');

    // --- Loop de Simulação e Renderização ---
    function animate() {
      requestAnimationFrame(animate);

      if (simParams.running) {
        // Executa o lote de gotas de erosão por frame
        for (let i = 0; i < simParams.dropsPerFrame; i++) {
          simulateDroplet();
        }
        updateTerrainMesh();
        updateRain();
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
