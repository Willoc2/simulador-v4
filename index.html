];

function cloudCumulus(x, y, s){
  const baseY = y + s*0.42;
  ctx.save(); ctx.beginPath(); ctx.rect(x - s*4, y - s*5, s*8, baseY - (y - s*5)); ctx.clip();
  BLOBS_CU.forEach(b => {
    const hf = clamp((-b[1] + 0.3)/1.5, 0, 1);
    puff(x + b[0]*s, y + b[1]*s, b[2]*s, mixC([214,224,238], WHITE, hf), mixC([118,136,166], [196,208,228], hf), 1);
  });
  softEllipse(x, baseY - s*0.05, s*1.7, s*0.2, [110,126,152], 0.4);
  ctx.restore();
}

function rainShaft(x, s, rainTop, groundY, halfW, dark){
  if (groundY <= rainTop + 6) return;
  const g = ctx.createLinearGradient(0, rainTop, 0, groundY);
  g.addColorStop(0, dark ? 'rgba(140,158,182,0.30)' : 'rgba(160,178,200,0.22)');
  g.addColorStop(1, 'rgba(160,178,200,0.04)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - halfW, rainTop); ctx.lineTo(x + halfW, rainTop);
  ctx.lineTo(x + halfW*1.25, groundY); ctx.lineTo(x - halfW*0.85, groundY);
  ctx.closePath(); ctx.fill();
  const cyc = groundY - rainTop;
  ctx.strokeStyle = 'rgba(178,208,238,0.75)'; ctx.lineWidth = 1;
  for (let i=0; i<38; i++){
    const rx = x + (hash1(i*3.7) - 0.5)*halfW*2*(0.9 + 0.25*((time*140 + i*53) % cyc)/cyc);
    const ry = rainTop + ((time*140 + i*53) % cyc);
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 2, ry + 10); ctx.stroke();
  }
}

function cloudCb(x, y, s, groundY){
  BLOBS_CB.forEach(b => {
    const hf = clamp((-b[1] + 0.6)/2.9, 0, 1);
    puff(x + b[0]*s, y + b[1]*s, b[2]*s, mixC([120,134,158], WHITE, hf), mixC([52,62,80], [170,184,208], hf), 1);
  });
  softEllipse(x + s*0.2, y - s*2.35, s*2.5, s*0.30, [248,250,255], 0.92);
  softEllipse(x - s*0.3, y - s*2.15, s*2.0, s*0.22, [225,232,244], 0.80);
  softEllipse(x, y + s*1.25, s*2.1, s*0.30, [38,46,60], 0.65);
  rainShaft(x, s, y + s*1.3, groundY, s*1.4, true);
  const ph = (time*1.3) % 3;
  if (ph < 0.28){
    ctx.strokeStyle = 'rgba(255,244,170,0.95)'; ctx.lineWidth = Math.max(1.4, s*0.05);
    ctx.beginPath();
    ctx.moveTo(x - s*0.1, y + s*0.4); ctx.lineTo(x + s*0.18, y + s*0.85);
    ctx.lineTo(x - s*0.12, y + s*1.05); ctx.lineTo(x + s*0.25, y + s*1.6);
    ctx.stroke();
    softEllipse(x, y + s*0.2, s*1.6, s*0.9, [255,244,190], 0.18);
  }
}

function cloudNimbo(x, y, s, groundY){
  for (let k=0; k<7; k++)
    softEllipse(x + (k-3)*0.75*s, y + ((k%2) ? 0.05 : -0.08)*s, 1.3*s, 0.55*s, [88,100,120], 0.78);
  softEllipse(x + 0.3*s, y - 0.25*s, 2.2*s, 0.35*s, [120,132,150], 0.5);
  softEllipse(x, y + 0.28*s, 2.7*s, 0.4*s, [52,63,80], 0.6);
  rainShaft(x, s, y + 0.45*s, groundY, s*1.9, false);
}

function cloudStratus(x, y, s){
  for (let k=0; k<6; k++)
    softEllipse(x + (k-2.5)*0.9*s, y + (hash1(k*3.3)-0.5)*0.12*s, 1.5*s, 0.30*s, [190,200,214], 0.58);
  softEllipse(x, y + 0.12*s, 3.0*s, 0.22*s, [140,152,170], 0.4);
}

function cloudStratocumulus(x, y, s){
  for (let c=-1; c<=1; c++){
    for (let k=0; k<5; k++){
      const r = 0.5*s*(0.8 + 0.25*hash1(c*7 + k*2.3));
      puff(x + c*1.9*s + (k-2)*0.5*s, y + ((k%2) ? -0.06 : 0.03)*s, r, [238,242,250], [125,138,160], 0.96, 0.7);
    }
    softEllipse(x + c*1.9*s, y + 0.22*s, 1.5*s, 0.16*s, [120,134,156], 0.35);
  }
}

function cloudAltocumulus(x, y, s){
  for (let r=0; r<2; r++){
    for (let k=0; k<7; k++){
      const rr = 0.22*s*(0.85 + 0.3*hash1(r*9 + k*1.7));
      puff(x + (k-3)*0.36*s + r*0.18*s, y + r*0.24*s + Math.sin(k*1.3)*0.05*s, rr, WHITE, [150,165,190], 0.96, 0.75);
    }
  }
}

function cloudAltostratus(x, y, s){
  for (let k=0; k<5; k++) softEllipse(x + (k-2)*0.9*s, y, 1.4*s, 0.42*s, [152,165,186], 0.6);
  softEllipse(x + 0.6*s, y - 0.12*s, 1.5*s, 0.3*s, [226,233,243], 0.35);
}

function cloudCirrus(x, y, s){
  ctx.save(); ctx.lineCap = 'round';
  for (let k=0; k<7; k++){
    const oy = (k-3)*0.13*s + (hash1(k*3.1)-0.5)*0.1*s;
    const len = (1.0 + hash1(k*5.3)*1.4)*s;
    const ox = (hash1(k*7.9)-0.5)*1.4*s;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.35*hash1(k*2.7)).toFixed(2) + ')';
    ctx.lineWidth = Math.max(0.8, s*0.045*(1.4 - hash1(k*4.1)*0.8));
    ctx.beginPath(); ctx.moveTo(x + ox - len, y + oy + len*0.06);
    ctx.bezierCurveTo(x + ox - len*0.3, y + oy - len*0.16, x + ox + len*0.35, y + oy - len*0.12, x + ox + len, y + oy + len*0.14);
    ctx.stroke();
  }
  ctx.restore();
}

function cloudCirrocumulus(x, y, s){
  for (let r=0; r<3; r++)
    for (let k=0; k<9; k++)
      puff(x + (k-4)*0.3*s + (r%2)*0.15*s, y + (r-1)*0.2*s, 0.11*s*(0.8 + 0.4*hash1(r*5 + k)), WHITE, [190,205,230], 0.92);
}

function cloudCirrostratus(x, y, s){
  softEllipse(x, y, 2.6*s, 0.5*s, [240,246,252], 0.42);
  softEllipse(x + 0.4*s, y + 0.05*s, 3.2*s, 0.3*s, [246,250,255], 0.28);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 0.8;
  for (let i=0; i<6; i++){
    const off = (i-3)*0.11*s;
    ctx.beginPath(); ctx.moveTo(x - 2.4*s, y + off); ctx.quadraticCurveTo(x, y + off - 0.05*s, x + 2.4*s, y + off); ctx.stroke();
  }
}

function drawCloud(x, y, s, tipo, groundY){
  switch (tipo){
    case 'cirrus': cloudCirrus(x, y, s); break;
    case 'cirrocumulus': cloudCirrocumulus(x, y, s); break;
    case 'cirrostratus': cloudCirrostratus(x, y, s); break;
    case 'altocumulus': cloudAltocumulus(x, y, s); break;
    case 'altostratus': cloudAltostratus(x, y, s); break;
    case 'stratocumulus': cloudStratocumulus(x, y, s); break;
    case 'stratus': cloudStratus(x, y, s); break;
    case 'nimbostratus': cloudNimbo(x, y, s, groundY); break;
    case 'cumulonimbus': cloudCb(x, y, s, groundY); break;
    default: cloudCumulus(x, y, s);
  }
}

/* ============ RELEVO ============ */
function envW(fx, a, b, m){ return smooth01((fx - (a - m))/m) * smooth01(((b + m) - fx)/m); }
const cityEnv = fx => envW(fx, 0.685, 0.985, 0.02);

function ridged(fx, freq, oct, seed){
  const r = 1 - Math.abs(2*fbm(fx*freq, oct, seed) - 1);
  return Math.pow(clamp((r - 0.45)/0.55, 0, 1), 1.15);
}
function farH(fx, ls, oct){ return ls.mount*0.62*(0.22 + 0.78*ridged(fx, 5, oct, 2))*(0.7 + 0.3*fbm(fx*1.7, 3, 5)); }
function mountH(fx, ls, oct){
  const env = envW(fx, 0.37, 0.63, 0.12);
  if (env <= 0) return 0;
  return ls.mount*env*(0.14 + 0.86*ridged(fx, 8, oct, 1));
}
function hillH(fx, ls, oct){ return ls.hill*(1 - 0.92*cityEnv(fx))*(0.3 + 1.4*fbm(fx*12 + 5, oct, 3)); }
function treeLimit(fx, ls, oct){ return ls.mount*(0.27 + 0.10*(vnoise(fx*40) - 0.5)) + hillH(fx, ls, oct); }

/* ---------- árvores (rede hierárquica: aproximar só ACRESCENTA árvores, não as reposiciona) ---------- */
function drawTreeRow(edgeFn, densFn, seed, scale, haze, sink, conProb, ySurf, ls){
  const treeH = ls.tree*scale;
  if (treeH < 1.6) return;
  const vx = getViewX();
  const P = Math.max(6, treeH*0.42);
  const L = clamp(Math.floor(Math.log2(W*view.zoom/P)), 0, 15);
  const N = Math.pow(2, L), shift = Math.pow(2, 16 - L);
  const j0 = Math.max(0, Math.floor(vx.xMin*N) - 2), j1 = Math.min(N - 1, Math.ceil((vx.xMin + vx.winW)*N) + 2);
  const cD = mixC([20,82,46], HAZE, haze), cM0 = [40,108,52], cL = mixC([100,168,88], HAZE, haze);
  for (let j=j0; j<=j1; j++){
    const id = j*shift;
    const tz = id > 0 ? 31 - Math.clz32(id & -id) : 16;
    const Lc = 16 - Math.min(16, tz);
    const jit = (hash1(id*2.71 + seed + 3) - 0.5)*0.8/Math.pow(2, Math.max(Lc, 3));
    const fx = clamp(id/65536 + jit, 0, 1);
    if (hash1(id*1.13 + seed) > densFn(fx)) continue;
    const sx = (fx - vx.xMin)/vx.winW*W;
    if (sx < -treeH || sx > W + treeH) continue;
    const yb = ySurf - edgeFn(fx) + treeH*sink;
    const hs = treeH*(0.62 + 0.55*hash1(id*3.3 + seed));
    const v = hash1(id*4.9 + seed + 7);
    const cM = mixC(mixC(cM0, [82,124,40], v*0.55), HAZE, haze);
    const sway = Math.sin(time*0.8 + id*0.37)*hs*0.02;
    if (hs < 7){
      ctx.fillStyle = rgbS(mixC(cD, cM, v));
      ctx.beginPath(); ctx.moveTo(sx + sway, yb - hs); ctx.lineTo(sx - hs*0.24, yb); ctx.lineTo(sx + hs*0.24, yb); ctx.closePath(); ctx.fill();
    } else if (hash1(id*5.7 + seed + 1) < conProb){
      ctx.fillStyle = '#4a3320'; ctx.fillRect(sx - hs*0.03, yb - hs*0.16, hs*0.06, hs*0.16);
      for (let t=0; t<3; t++){
        const cy = yb - hs*0.12 - t*hs*0.26, half = hs*0.19*(1.55 - t*0.36), top = cy - hs*0.36;
        ctx.fillStyle = rgbS(cD);
        ctx.beginPath(); ctx.moveTo(sx + sway*(1 + t*0.4), top); ctx.lineTo(sx - half, cy); ctx.lineTo(sx + half, cy); ctx.closePath(); ctx.fill();
        ctx.fillStyle = rgbaS(cL, 0.55);
        ctx.beginPath(); ctx.moveTo(sx + sway*(1 + t*0.4), top); ctx.lineTo(sx + half, cy); ctx.lineTo(sx + half*0.05, cy); ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.fillStyle = '#4a3320'; ctx.fillRect(sx - hs*0.035, yb - hs*0.34, hs*0.07, hs*0.34);
      ctx.fillStyle = rgbS(cM);
      ctx.beginPath();
      ctx.arc(sx, yb - hs*0.64, hs*0.30, 0, Math.PI*2);
      ctx.moveTo(sx - hs*0.2 + hs*0.22, yb - hs*0.52); ctx.arc(sx - hs*0.2, yb - hs*0.52, hs*0.22, 0, Math.PI*2);
      ctx.moveTo(sx + hs*0.2 + hs*0.23, yb - hs*0.54); ctx.arc(sx + hs*0.2, yb - hs*0.54, hs*0.23, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = rgbaS(cL, 0.55);
      ctx.beginPath(); ctx.arc(sx + hs*0.09, yb - hs*0.72, hs*0.16, 0, Math.PI*2); ctx.fill();
    }
  }
}

/* ---------- cidade ---------- */
function buildCity(seed, x0, x1, center, boost){
  const arr = []; let fx = x0, i = 0;
  while (fx < x1){
    const w = 0.008 + 0.016*hash1(seed*100 + i*1.7);
    const c = Math.abs(fx + w/2 - center)/0.14;
    const hf = clamp(0.2 + boost*0.3 + 0.85*hash1(seed*100 + i*2.3 + 1.1)*(1.05 - 0.55*Math.min(c, 1.2)), 0.14, 1);
    arr.push({ fx, w, hf, id:seed*1000 + i, pal:Math.floor(hash1(seed*100 + i*4.1 + 2)*4),
      cols:3 + Math.floor(hash1(seed*100 + i*5.7)*5), rows:3 + Math.floor(hf*15),
      ant: hf > 0.78 && hash1(i*3.3 + seed) > 0.35 });
    fx += w + 0.0015 + 0.003*hash1(seed*100 + i*6.3); i++;
  }
  return arr;
}
const CITY_FRONT = buildCity(1, 0.775, 0.972, 0.87, 0);
const CITY_BACK  = buildCity(2, 0.780, 0.968, 0.88, 0.35);
const BLD_PAL = [[86,102,124],[112,122,134],[72,84,100],[130,118,106]];

function drawBuilding(x, yb, bw, bh, b, haze){
  const c = mixC(BLD_PAL[b.pal], HAZE, haze);
  const g = ctx.createLinearGradient(x, yb - bh, x, yb);
  g.addColorStop(0, rgbS(mixC(c, WHITE, 0.18))); g.addColorStop(1, rgbS(mixC(c, [20,26,38], 0.35)));
  ctx.fillStyle = g; ctx.fillRect(x, yb - bh, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.fillRect(x + bw*0.82, yb - bh, bw*0.18, bh);
  ctx.fillStyle = 'rgba(10,15,30,0.15)';   ctx.fillRect(x, yb - bh, bw*0.12, bh);
  const roofH = Math.max(1, bh*0.015);
  ctx.fillStyle = rgbS(mixC(c, [30,34,44], 0.5)); ctx.fillRect(x - bw*0.02, yb - bh - roofH, bw*1.04, roofH);
  if (bw > 8 && bh > 10 && haze < 0.3){
    const cw = bw*0.78/b.cols, rh = bh*0.86/b.rows;
    for (let i=0; i<b.cols; i++){
      for (let j=0; j<b.rows; j++){
        const hv = hash1(b.id*13 + i*7.3 + j*3.1);
        let col;
        if (hv < 0.10 && ((Math.floor(time*0.12 + hv*40)) % 3 !== 0)) col = 'rgba(255,226,140,0.85)';
        else if (hv < 0.35) col = 'rgba(18,28,44,0.38)';
        else col = 'rgba(176,210,238,' + (0.22 + 0.18*hv).toFixed(2) + ')';
        ctx.fillStyle = col;
        ctx.fillRect(x + bw*0.11 + i*cw + cw*0.15, yb - bh + bh*0.06 + j*rh + rh*0.18, cw*0.62, rh*0.58);
      }
    }
  }
  if (b.ant && haze < 0.3){
    const aH = bh*0.22;
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + bw/2, yb - bh); ctx.lineTo(x + bw/2, yb - bh - aH); ctx.stroke();
    ctx.fillStyle = ((time*2) % 2 < 1) ? '#ef4444' : '#7f1d1d';
    ctx.beginPath(); ctx.arc(x + bw/2, yb - bh - aH, Math.max(1.2, bw*0.04), 0, Math.PI*2); ctx.fill();
  }
}

/* Fumaça: sem inversão sobe e se dispersa; com inversão bate no “teto” e se espalha na horizontal. */
function drawPlume(bx, by, hc, ls){
  const inv = state.inversion, ppk = pxPerKm();
  const rise = inv ? Math.max(invTopPx(ls) - hc, ls.bld*0.45) : Math.max(ppk*3.0, ls.bld*2.5);
  const drift = W*view.zoom*(inv ? 0.10 : 0.06);
  const N = 16;
  for (let i=0; i<N; i++){
    const p = (time*0.09 + i/N) % 1;
    const rf = inv ? Math.min(p*2.2, 1) : Math.pow(p, 0.85);
    const x = bx + Math.pow(p, 1.15)*drift + Math.sin(time*0.6 + i)*hc*0.05;
    const y = by - rf*rise;
    const r = hc*0.10 + p*hc*(inv ? 0.35 : 0.5);
    const a = inv ? 0.42*(1 - p*p*0.6) : 0.5*(1 - p);
    puff(x, y, r, [150,146,140], [70,66,64], a);
  }
}

function drawCity(ySurf, ls){
  if (ySurf - ls.bld*2.4 > H) return;
  const zx = W*view.zoom;
  const vx = getViewX();
  const draw = (arr, hm, haze) => arr.forEach(b => {
    const sx = (b.fx - vx.xMin)/vx.winW*W, bw = b.w*zx;
    if (sx + bw < -10 || sx > W + 10) return;
    drawBuilding(sx, ySurf + 1, bw, ls.bld*b.hf*hm, b, haze);
  });
  draw(CITY_BACK, 1.22, 0.5);
  draw(CITY_FRONT, 1.0, 0.04);
  // fábrica com duas chaminés
  const fx0 = sxFromWorld(0.700), fw = 0.052*zx;
  if (fx0 + fw > -10 && fx0 < W + 10){
    const fh = ls.bld*0.42;
    drawBuilding(fx0, ySurf + 1, fw, fh, { pal:1, cols:6, rows:2, id:9001, ant:false }, 0.02);
    [0.0105, 0.0395].forEach((off, k) => {
      const cx = fx0 + off*zx, cw = 0.0048*zx, hc = ls.bld*1.35;
      ctx.fillStyle = '#9a4a3a'; ctx.fillRect(cx, ySurf + 1 - hc, cw, hc);
      ctx.fillStyle = '#e8e2d8';
      for (let s=0; s<4; s++) ctx.fillRect(cx, ySurf + 1 - hc + hc*(0.08 + s*0.22), cw, hc*0.07);
      drawPlume(cx + cw/2, ySurf + 1 - hc, hc, ls);
    });
  }
}

/* ---------- paisagem completa (atrás → frente) ---------- */
const ROCK_LIT = [176,166,150], ROCK_SH = [74,70,68], SNOW_LIT = [252,253,255], SNOW_SH = [168,184,214];

function drawLandscape(usableH, ySurf, ls){
  const oct = clamp(4 + Math.floor(Math.log2(view.zoom)), 4, 12);
  const step = 4, vx = getViewX(), n = Math.ceil(W/step) + 2;
  const sxA = new Float32Array(n), fxA = new Float32Array(n), farA = new Float32Array(n), mtA = new Float32Array(n), hlA = new Float32Array(n);
  for (let i=0; i<n; i++){
    const sx = i*step, fx = vx.xMin + sx/W*vx.winW;
    sxA[i] = sx; fxA[i] = fx; farA[i] = farH(fx, ls, oct); mtA[i] = mountH(fx, ls, oct); hlA[i] = hillH(fx, ls, oct);
  }
  const base = ySurf + 4;
  let g;

  // L0: cordilheira distante (azulada, com neblina)
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let i=0; i<n; i++) ctx.lineTo(sxA[i], ySurf - farA[i]);
  ctx.lineTo(W, base); ctx.closePath();
  g = ctx.createLinearGradient(0, ySurf - ls.mount*0.75, 0, ySurf);
  g.addColorStop(0, rgbS(mixC([138,156,186], HAZE, 0.45))); g.addColorStop(1, rgbS(mixC([128,148,178], HAZE, 0.8)));
  ctx.fillStyle = g; ctx.fill();

  // L1: serra — faces iluminadas pelo sol (direita) e em sombra (esquerda), com transição suavizada
  const K = 7;
  let litA = new Float32Array(n);
  for (let i=0; i<n; i++){
    const a = Math.max(0, i-K), b = Math.min(n-1, i+K);
    const sl = ((mtA[a] + hlA[a]) - (mtA[b] + hlA[b]))/((b-a)*step);
    litA[i] = clamp(0.5 + sl*0.9, 0.06, 1);
  }
  for (let pass=0; pass<4; pass++){
    const t = new Float32Array(n);
    for (let i=0; i<n; i++) t[i] = (litA[Math.max(0,i-1)] + 2*litA[i] + litA[Math.min(n-1,i+1)])/4;
    litA = t;
  }
  for (let i=0; i<n-1; i++){
    if (mtA[i] < 0.4 && mtA[i+1] < 0.4) continue;
    ctx.fillStyle = rgbS(mixC(mixC(ROCK_SH, ROCK_LIT, litA[i]), HAZE, 0.14));
    ctx.beginPath();
    ctx.moveTo(sxA[i], ySurf - mtA[i] - hlA[i]); ctx.lineTo(sxA[i+1] + 0.8, ySurf - mtA[i+1] - hlA[i+1]);
    ctx.lineTo(sxA[i+1] + 0.8, base); ctx.lineTo(sxA[i], base); ctx.closePath(); ctx.fill();
  }
  // textura da rocha: estrias diagonais (rede hierárquica fixa no mundo), recortadas pela silhueta
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let i=0; i<n; i++) ctx.lineTo(sxA[i], ySurf - mtA[i] - hlA[i]);
  ctx.lineTo(W, base); ctx.closePath(); ctx.clip();
  {
    const Lr = clamp(Math.floor(Math.log2(W*view.zoom/9)), 0, 15), Nr = Math.pow(2, Lr), shr = Math.pow(2, 16 - Lr);
    const jA = Math.max(Math.floor(Math.max(vx.xMin, 0.26)*Nr), 0), jB = Math.min(Math.ceil(Math.min(vx.xMin + vx.winW, 0.74)*Nr), Nr - 1);
    for (let j=jA; j<=jB; j++){
      const id = j*shr;
      const fx = id/65536 + (hash1(id*1.7) - 0.5)*0.5/Nr;
      const mt = mountH(fx, ls, oct) + hillH(fx, ls, oct);
      if (mt < ls.mount*0.12) continue;
      const sx = sxFromWorld(fx), y0 = ySurf - mt, len = mt*(0.15 + 0.55*hash1(id*7.7));
      const facing = mountH(fx - 0.002, ls, oct) - mountH(fx + 0.002, ls, oct) > 0;
      const al = 0.05 + 0.12*hash1(id*3.9);
      ctx.strokeStyle = facing ? 'rgba(255,250,238,' + al.toFixed(3) + ')' : 'rgba(18,14,12,' + (al*1.4).toFixed(3) + ')';
      ctx.lineWidth = 1 + hash1(id*5.1)*1.6;
      ctx.beginPath(); ctx.moveTo(sx, y0 + len*0.04); ctx.lineTo(sx - len*0.35, y0 + len); ctx.stroke();
    }
  }
  ctx.restore();
  // neve acima da linha de neve (borda irregular)
  const snowH = ls.mount*0.74;
  for (let i=0; i<n-1; i++){
    const h0 = mtA[i] + hlA[i], h1 = mtA[i+1] + hlA[i+1];
    if (h0 < snowH*0.85 && h1 < snowH*0.85) continue;
    const jit = (0.6*vnoise(fxA[i]*140 + 9) + 0.4*vnoise(fxA[i]*40))*ls.mount*0.10;
    const yS = ySurf - (snowH - jit);
    const y0 = ySurf - h0, y1 = ySurf - h1;
    if (y0 > yS && y1 > yS) continue;
    ctx.fillStyle = rgbS(mixC(SNOW_SH, SNOW_LIT, litA[i]));
    ctx.beginPath();
    ctx.moveTo(sxA[i], Math.min(y0, yS)); ctx.lineTo(sxA[i+1] + 0.8, Math.min(y1, yS));
    ctx.lineTo(sxA[i+1] + 0.8, yS); ctx.lineTo(sxA[i], yS); ctx.closePath(); ctx.fill();
  }
  // estrias diagonais na neve (sombras azuladas nas reentrâncias, brilho nas cristas)
  {
    const Lr = clamp(Math.floor(Math.log2(W*view.zoom/9)), 0, 15), Nr = Math.pow(2, Lr), shr = Math.pow(2, 16 - Lr);
    const jA = Math.max(Math.floor(Math.max(vx.xMin, 0.26)*Nr), 0), jB = Math.min(Math.ceil(Math.min(vx.xMin + vx.winW, 0.74)*Nr), Nr - 1);
    for (let j=jA; j<=jB; j++){
      const id = j*shr;
      const fx = id/65536 + (hash1(id*1.7) - 0.5)*0.5/Nr;
      const mt = mountH(fx, ls, oct) + hillH(fx, ls, oct);
      if (mt < snowH) continue;
      const jit = (0.6*vnoise(fx*140 + 9) + 0.4*vnoise(fx*40))*ls.mount*0.10;
      const room = (mt - (snowH - jit))*0.92;
      if (room < 4) continue;
      const sx = sxFromWorld(fx), y0 = ySurf - mt, len = room*(0.3 + 0.7*hash1(id*7.7));
      const facing = mountH(fx - 0.002, ls, oct) - mountH(fx + 0.002, ls, oct) > 0;
      const al = 0.10 + 0.22*hash1(id*3.9);
      ctx.strokeStyle = facing ? 'rgba(255,255,255,' + al.toFixed(3) + ')' : 'rgba(96,120,176,' + (al*1.5).toFixed(3) + ')';
      ctx.lineWidth = 1 + hash1(id*5.1)*1.8;
      ctx.beginPath(); ctx.moveTo(sx, y0 + len*0.05); ctx.lineTo(sx - len*0.3, y0 + len); ctx.stroke();
    }
  }
  // névoa na base da serra
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let i=0; i<n; i++) ctx.lineTo(sxA[i], ySurf - mtA[i] - hlA[i]);
  ctx.lineTo(W, base); ctx.closePath();
  g = ctx.createLinearGradient(0, ySurf - ls.mount, 0, ySurf);
  g.addColorStop(0, rgbaS(HAZE, 0)); g.addColorStop(1, rgbaS(HAZE, 0.42));
  ctx.fillStyle = g; ctx.fill();

  // tapete de floresta nas encostas (abaixo da linha de árvores)
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let i=0; i<n; i++) ctx.lineTo(sxA[i], ySurf - Math.min(mtA[i] + hlA[i], treeLimit(fxA[i], ls, oct)));
  ctx.lineTo(W, base); ctx.closePath();
  g = ctx.createLinearGradient(0, ySurf - ls.mount*0.4, 0, ySurf);
  g.addColorStop(0, rgbS(mixC([34,100,54], HAZE, 0.14))); g.addColorStop(1, rgbS(mixC([20,68,42], HAZE, 0.2)));
  ctx.fillStyle = g; ctx.fill();
  const edgeMt = fx => Math.min(mountH(fx, ls, oct) + hillH(fx, ls, oct), treeLimit(fx, ls, oct));
  drawTreeRow(edgeMt, fx => envW(fx, 0.37, 0.63, 0.12) > 0.06 ? 0.9 : 0, 21, 0.85, 0.16, 0.05, 0.75, ySurf, ls);

  // L2: colinas em primeiro plano — fileira de árvores ao fundo, colina, fileira à frente
  const dFront = fx => lerp(0.22, 0.95, envW(fx, 0.03, 0.34, 0.08))*(1 - cityEnv(fx));
  const edgeHill = fx => hillH(fx, ls, oct);
  drawTreeRow(edgeHill, dFront, 11, 0.8, 0.10, 0.32, 0.6, ySurf, ls);
  ctx.beginPath(); ctx.moveTo(0, base);
  for (let i=0; i<n; i++) ctx.lineTo(sxA[i], ySurf - hlA[i] - 1);
  ctx.lineTo(W, base); ctx.closePath();
  g = ctx.createLinearGradient(0, ySurf - ls.hill*2, 0, ySurf);
  g.addColorStop(0, '#68a24a'); g.addColorStop(1, '#3f7a34');
  ctx.fillStyle = g; ctx.fill();
  // floresta muito pequena para árvores individuais: faixa escura texturizada
  if (ls.tree*0.8 < 6){
    ctx.fillStyle = 'rgba(28,84,48,0.95)';
    ctx.beginPath(); ctx.moveTo(sxFromWorld(0.03), base);
    for (let i=0; i<n; i++){
      const fx = fxA[i]; if (fx < 0.03 || fx > 0.34) continue;
      ctx.lineTo(sxA[i], ySurf - hlA[i] - Math.max(1.8, ls.tree*0.9*(0.6 + 0.6*vnoise(fx*300))));
    }
    ctx.lineTo(sxFromWorld(0.34), base); ctx.closePath(); ctx.fill();
  }
  drawTreeRow(edgeHill, dFront, 31, 1.0, 0.0, 0.05, 0.6, ySurf, ls);

  drawCity(ySurf, ls);
}

/* ---------- solo em corte (camadas, pedregulhos, grama) e rótulos ---------- */
function drawGround(usableH, ySurf, ls){
  if (ySurf >= usableH) return;
  const y0 = ySurf, vx = getViewX(), zs = Math.min(view.zoom, 6);
  const depth = Math.max(usableH - y0, 120);
  const g = ctx.createLinearGradient(0, y0, 0, y0 + depth);
  g.addColorStop(0, '#5c9a3e'); g.addColorStop(0.03, '#3e7530'); g.addColorStop(0.055, '#6a4a2c');
  g.addColorStop(0.3, '#4b3421'); g.addColorStop(0.7, '#33261a'); g.addColorStop(1, '#211a15');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, usableH - y0);

  const sp = 0.004;
  for (let j=Math.floor(vx.xMin/sp); j<=Math.ceil((vx.xMin + vx.winW)/sp); j++){
    const y = y0 + (12 + hash1(j*3.3 + 1)*230)*zs;
    if (y > usableH) continue;
    const sz = (1 + hash1(j*7.1)*2.2)*Math.min(view.zoom, 4)*0.9;
    ctx.fillStyle = hash1(j*5.5) > 0.5 ? 'rgba(20,14,10,0.35)' : 'rgba(150,130,105,0.25)';
    ctx.fillRect(sxFromWorld((j + hash1(j*1.9))*sp), y, sz*1.4, sz);
  }
  const gb = 0.0035;
  ctx.lineWidth = 1;
  for (let k=Math.floor(vx.xMin/gb); k<=Math.ceil((vx.xMin + vx.winW)/gb); k++){
    const sx = sxFromWorld((k + hash1(k))*gb);
    const len = (2 + hash1(k*2.1)*3.5)*Math.min(view.zoom, 5)*0.8*(state.realScale ? 0.5 : 1);
    ctx.strokeStyle = hash1(k*3.7) > 0.5 ? '#4f8f36' : '#3b7a2e';
    ctx.beginPath(); ctx.moveTo(sx, y0 + 1); ctx.lineTo(sx + Math.sin(time*1.4 + k)*len*0.25, y0 - len); ctx.stroke();
  }
  const labelY = y0 + Math.min(usableH - y0 - 3, 14);
  if (labelY > 8 && labelY < usableH){
    ctx.font = 'bold 9px Segoe UI'; ctx.textAlign = 'center';
    const real = state.realScale;
    [['🌲 FLORESTA' + (real ? ' (~40 m)' : ''), 0.18, 'rgba(134,239,172,.9)'],
     ['⛰️ SERRA' + (real ? ' (~1,5 km)' : ''), 0.50, 'rgba(226,232,240,.9)'],
     ['🏙️ CIDADE' + (real ? ' (~200 m)' : ''), 0.84, 'rgba(226,232,240,.9)']].forEach(l => {
      const sx = sxFromWorld(l[1]);
      if (sx > 60 && sx < W - 60){ ctx.fillStyle = l[2]; ctx.fillText(l[0], sx, labelY); }
    });
    ctx.textAlign = 'left';
  }
}

/* ---------- poluição presa pela inversão térmica ---------- */
function drawSmog(usableH, ySurf, ls){
  if (!state.inversion || ySurf < 0) return;
  const top = ySurf - invTopPx(ls);
  if (top > usableH || ySurf < 0) return;
  const y0 = Math.max(0, top), y1 = Math.min(usableH, ySurf);
  if (y1 <= y0) return;
  let g = ctx.createLinearGradient(0, top, 0, ySurf);
  g.addColorStop(0, 'rgba(168,140,104,0.05)'); g.addColorStop(0.06, 'rgba(170,140,100,0.34)'); g.addColorStop(1, 'rgba(120,100,78,0.40)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, y1 - y0); ctx.clip();
  softEllipse(sxFromWorld(0.84), ySurf - (ySurf - top)*0.4, 0.22*W*view.zoom, (ySurf - top)*0.75, [120,96,70], 0.38);
  ctx.restore();
  if (top >= 0 && top <= usableH){
    ctx.strokeStyle = 'rgba(255,232,190,0.55)'; ctx.lineWidth = 1.2; ctx.setLineDash([10,6]);
    ctx.beginPath(); ctx.moveTo(RULER_WIDTH, top); ctx.lineTo(W, top); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fde047'; ctx.font = 'bold 10px Segoe UI';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3;
    ctx.fillText('🔥 INVERSÃO TÉRMICA · a temperatura sobe com a altitude e a poluição fica presa', W*0.36, top - 5);
    ctx.shadowBlur = 0;
  }
}

function drawContrail(x, y, s){
  const len = s*16;
  const g = ctx.createLinearGradient(x - len, 0, x, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.65)');
  ctx.strokeStyle = g; ctx.lineWidth = Math.max(1, s*0.16);
  ctx.beginPath(); ctx.moveTo(x - len, y + s*0.05); ctx.lineTo(x - s*1.2, y + s*0.05); ctx.stroke();
  ctx.lineWidth = Math.max(1, s*0.10);
  ctx.beginPath(); ctx.moveTo(x - len*0.8, y - s*0.12); ctx.lineTo(x - s*1.2, y - s*0.1); ctx.stroke();
}

/* ============ SETAS DE RADIAÇÃO ============ */
/* Seta animada que percorre o trecho yA → yB. dirWanted: 1 = para baixo, -1 = para cima. */
function ray(x, yA, yB, color, p, lw, dirWanted){
  const len = yB - yA;
  if (len*dirWanted < 16) return;
  const dir = dirWanted;
  const head = yA + len*p;
  let tail = head - dir*Math.min(22, Math.abs(len));
  if ((dir > 0 && tail < yA) || (dir < 0 && tail > yA)) tail = yA;
  ctx.save();
  ctx.globalAlpha = p > 0.88 ? Math.max(0, (1-p)/0.12) : 1;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x, tail); ctx.lineTo(x, head); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, head + dir*5); ctx.lineTo(x-3.5, head - dir*2); ctx.lineTo(x+3.5, head - dir*2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function glow(x, y, rgb){
  const r = 4 + Math.sin(time*4 + x)*1.2;
  ctx.fillStyle = 'rgba(' + rgb + ',.55)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}

/* ============ RENDER PRINCIPAL ============ */
const RULER_X = 26;
const RULER_WIDTH = 52;

function drawEstrutura(){
  const w = W, h = H;
  const usableH = h - LEGEND_HEIGHT;
  const ySurf = yFromKm(0);
  const vy = getViewWindow();
  const uAtY = y => vy.uMin + (1 - y/usableH)*vy.winW;
  const ppk = pxPerKm();
  const ls = landScale(usableH);

  // 1. Céu (gradiente por altitude: horizonte claro → azul profundo → espaço)
  const grad = ctx.createLinearGradient(0, 0, 0, usableH);
  const NG = 40;
  for (let i=0; i<=NG; i++){
    const t = i/NG;
    grad.addColorStop(t, rgbS(skyColor(kmFromU(vy.uMax - t*(vy.uMax - vy.uMin)))));
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, usableH);

  // 2. Estrelas (aparecem onde o céu escurece), sol e aurora
  drawStars(usableH, uAtY);
  drawSun(w - 110, 90);
  drawAurora(usableH);

  // 3. Buffer da camada ativa
  if (state.activeLayer){
    const L = LAYERS[state.activeLayer];
    const top = Math.min(yFromKm(L.kmTop), yFromKm(L.kmBot));
    const bot = Math.max(yFromKm(L.kmTop), yFromKm(L.kmBot));
    if (bot > 0 && top < usableH){
      ctx.fillStyle = L.color + '2a';
      ctx.fillRect(0, Math.max(0, top), w, Math.min(usableH, bot) - Math.max(0, top));
      ctx.strokeStyle = L.color; ctx.lineWidth = 2.5; ctx.setLineDash([8, 5]);
      if (top >= 0 && top <= usableH){ ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(w, top); ctx.stroke(); }
      if (bot >= 0 && bot <= usableH){ ctx.beginPath(); ctx.moveTo(0, bot); ctx.lineTo(w, bot); ctx.stroke(); }
      ctx.setLineDash([]);
      if (top >= 0 && top < usableH - 30){
        const label = '▸ ' + L.name.toUpperCase() + ' (' + L.rangeTxt + ')';
        ctx.font = 'bold 12px Segoe UI';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = L.color;
        ctx.fillRect(w/2 - tw/2 - 14, top + 8, tw + 28, 24);
        ctx.fillStyle = '#0f172a';
        ctx.fillText(label, w/2 - tw/2, top + 24);
      }
    }
  }

  // 4. Linhas das camadas
  const drawLine = (km, label, xLabel) => {
    const y = yFromKm(km);
    if (y < 0 || y > usableH) return;
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.setLineDash([6,6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(RULER_WIDTH, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.78)'; ctx.font = 'bold 10px Segoe UI';
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 3;
    ctx.fillText(label, xLabel === undefined ? RULER_WIDTH + 10 : xLabel, y - 4);
    ctx.shadowBlur = 0;
  };
  drawLine(12, 'TROPOPAUSA · 12 km');
  drawLine(50, 'ESTRATOPAUSA · 50 km');
  drawLine(80, 'MESOPAUSA · 80 km');
  drawLine(600, 'LIMITE TERMOSFERA / EXOSFERA · ~600 km (varia)', w*0.42);

  // 5. Nomes verticais das camadas
  const layerNames = [
    { km:6,   name:'TROPOSFERA',   color:'rgba(251,146,60,.85)' },
    { km:31,  name:'ESTRATOSFERA', color:'rgba(56,189,248,.8)' },
    { km:65,  name:'MESOSFERA',    color:'rgba(167,139,250,.75)' },
    { km:200, name:'TERMOSFERA',   color:'rgba(244,114,182,.75)' },
    { km:700, name:'EXOSFERA',     color:'rgba(192,132,252,.75)' }
  ];
  ctx.font = 'bold 10px Segoe UI';
  layerNames.forEach(ln => {
    const y = yFromKm(ln.km);
    if (y >= 0 && y <= usableH){
      const tw = ctx.measureText(ln.name).width;
      const yy = Math.max(tw + 4, Math.min(usableH - 4, y + tw/2));
      ctx.save();
      ctx.translate(w - 8, yy);
      ctx.rotate(-Math.PI/2);
      ctx.fillStyle = ln.color;
      ctx.fillText(ln.name, 0, 0);
      ctx.restore();
    }
  });

  // 6. Ozônio
  if (state.ozone){
    const y1 = yFromKm(35), y2 = yFromKm(20);
    if (y2 > 0 && y1 < usableH){
      const t0 = Math.max(0, y1), t1 = Math.min(usableH, y2);
      const oz = ctx.createLinearGradient(0, t0, 0, t1);
      oz.addColorStop(0, 'rgba(59,130,246,0)');
      oz.addColorStop(0.5, 'rgba(96,165,250,.42)');
      oz.addColorStop(1, 'rgba(59,130,246,0)');
      ctx.fillStyle = oz;
      ctx.fillRect(0, t0, w, t1 - t0);
      ctx.fillStyle = '#93c5fd'; ctx.font = 'bold 11px Segoe UI';
      ctx.fillText('🛡️ CAMADA DE OZÔNIO', w - 155, (t0+t1)/2 + 4);
    }
  }

  // 7. Radiação — fluxos proporcionais ao balanço de calor do livro (pág. 36)
  if (state.showRadiation){
    const R = radBudget();
    const rd = Math.round;
    const cl = v => Math.max(-40, Math.min(usableH + 30, v));
    const yTop = 64;
    const yCloud  = cl(yFromKm(4));
    const yAbsA   = cl(yFromKm(8));
    const yAtm    = cl(yFromKm(5));
    const yGround = cl(ySurf - 4);
    const ph = (k, off) => (time*0.15 + k*0.137 + (off||0)) % 1;

    const NS = 10, fr = R.refl/R.S, fa = R.absAtm/R.S;
    const nRefl = Math.round(fr*NS);
    const nAtmRefl = Math.round(nRefl*(R.reflAtm/Math.max(R.refl, 0.001)));
    for (let k=0; k<NS; k++){
      const x = w*(0.16 + 0.68*(k+0.5)/NS);
      const pos = (k+0.5)/NS;
      if (pos < fr){
        const yB = (k < nAtmRefl) ? yCloud : yGround;
        ray(x, yTop, yB, '#fde047', ph(k), 1.8, 1);
        ray(x+8, yB, yTop, '#fef9c3', ph(k), 1.4, -1);
      } else if (pos < fr + fa){
        ray(x, yTop, yAbsA, '#fbbf24', ph(k), 1.8, 1);
        if (yAbsA > yTop + 16 && yAbsA < usableH) glow(x, yAbsA, '251,191,36');
      } else {
        ray(x, yTop, yGround, '#facc15', ph(k), 1.8, 1);
      }
    }
    const yOz = yFromKm(27.5);
    for (let i=0; i<3; i++){
      const x = RULER_WIDTH + 34 + i*22;
      const yEnd = state.ozone ? cl(yOz) : yGround;
      ray(x, yTop + 26, yEnd, '#c4b5fd', ph(i, 0.4), 1.6, 1);
      if (state.ozone && yOz > yTop + 42 && yOz < usableH) glow(x, yOz, '196,181,253');
    }
    ctx.font = 'bold 9px Segoe UI'; ctx.fillStyle = '#c4b5fd';
    ctx.fillText('UV', RULER_WIDTH + 30, yTop + 20);

    const NT = 8, wFrac = R.win/R.Es;
    for (let k=0; k<NT; k++){
      const x = w*(0.19 + 0.68*(k+0.5)/NT);
      if ((k+0.5)/NT < wFrac){
        ray(x, yGround, yTop, '#ff6b6b', ph(k, 0.3), 2.4, -1);
      } else {
        ray(x, yGround, yAtm, '#ef4444', ph(k, 0.3), 1.8, -1);
        if (yAtm < usableH && yAtm > yTop + 16) glow(x, yAtm, '192,132,252');
      }
    }
    const NB = 5, lwBack = 1 + 1.6*R.back/R.Es;
    for (let k=0; k<NB; k++){
      const x = w*(0.23 + 0.62*(k+0.5)/NB);
      ray(x, yAtm, yGround, '#fb923c', ph(k, 0.6), lwBack, 1);
    }
    const NU = 4, lwUp = Math.max(0.8, 1.6*R.upAtm/195);
    for (let k=0; k<NU; k++){
      const x = w*(0.21 + 0.64*(k+0.5)/NU);
      ray(x, yAtm, yTop, '#f87171', ph(k, 0.8), lwUp, -1);
    }
    const nDots = 6 + 6*radState.gh;
    const yHi = yFromKm(10), yLo = yFromKm(0.5);
    for (let i=0; i<nDots; i++){
      const x = ((i*137 + time*15) % w);
      const y = yHi + (((i*73) % 100)/100)*(yLo - yHi);
      if (y > 20 && y < usableH - 10){
        ctx.fillStyle = 'rgba(192,132,252,.75)';
        ctx.beginPath(); ctx.arc(x, y, 3 + Math.sin(time + i)*0.5, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.font = 'bold 11px Segoe UI';
    const netTxt = (rd(R.net) > 0 ? '+' : '') + rd(R.net);
    const tags = [
      ['☀️ RADIAÇÃO SOLAR: ' + rd(R.S) + ' W/m²', '#fde047'],
      ['🔴 TERRESTRE (superfície): ' + rd(R.Es) + ' W/m²', '#ef4444'],
      ['⚖️ SALDO: ' + netTxt + ' W/m²', Math.abs(R.net) < 1.5 ? '#4ade80' : (R.net > 0 ? '#fb923c' : '#38bdf8')]
    ];
    tags.forEach((tg, i) => {
      const yy = 14 + i*18;
      ctx.fillStyle = 'rgba(15,23,42,.85)';
      ctx.fillRect(RULER_WIDTH + 10, yy, ctx.measureText(tg[0]).width + 8, 16);
      ctx.fillStyle = tg[1];
      ctx.fillText(tg[0], RULER_WIDTH + 14, yy + 12);
    });
  }

  // 8. Paisagem (serra, floresta, cidade), solo em corte e poluição
  if (ySurf - ls.mount*1.25 - ls.bld*2.5 < usableH + 10) drawLandscape(usableH, ySurf, ls);
  drawGround(usableH, ySurf, ls);
  drawSmog(usableH, ySurf, ls);

  // 9. Nuvens (posições no mundo: acompanham zoom e deslocamento)
  if (state.showClouds){
    const s0 = ppk*1.1;
    const tipo = resolveCloud();
    const groundY = Math.min(ySurf, usableH + 40);
    const mult = { cirrus:1.5, cirrocumulus:1.3, cirrostratus:1.2, altocumulus:1.3, altostratus:1.2,
                   stratocumulus:1.1, stratus:1.1, nimbostratus:1.2, cumulus:1.0, cumulonimbus:1.8 };
    const put = (t, fx, km, k) => {
      const s = s0*(mult[t] || 1)*(k || 1);
      const x = sxFromWorld(fx);
      if (x < -6*s || x > w + 6*s) return;
      let y = yFromKm(km);
      if (t === 'cumulonimbus') y -= 1.3*s;          // km = altitude da base
      if (y < -8*s || y > usableH + 8*s) return;
      drawCloud(x, y, s, t, groundY);
    };
    if (tipo === 'none'){
      // ar seco (umidade baixa): céu limpo
    } else if (tipo === 'all'){
      [['cirrus',0.15,11],['cirrocumulus',0.38,10],['cirrostratus',0.62,10.5],['altocumulus',0.85,6],
       ['altostratus',0.20,4.5],['stratocumulus',0.42,1.8],['stratus',0.60,0.8],['nimbostratus',0.78,2.0],
       ['cumulus',0.93,1.6],['cumulonimbus',0.50,1.4]].forEach(c => put(c[0], c[1], c[2]));
    } else {
      const drift = (time*0.3) % 1;
      const kmByType = { cirrus:10, cirrocumulus:10, cirrostratus:10.5, altocumulus:5, altostratus:4.5,
                         stratocumulus:1.8, stratus:1.2, nimbostratus:2.0, cumulus:1.6, cumulonimbus:1.4 };
      const km = kmByType[tipo] || 4;
      if (tipo === 'cumulonimbus'){
        put(tipo, 0.30, km, 0.85); put(tipo, 0.72, km, 1.2);
      } else {
        for (let k=0; k<4; k++) put(tipo, ((k + 0.5)/4 + drift*0.1 + 0.05*hash1(k*3.3)) % 1, km + (hash1(k*7.1) - 0.5)*0.6);
      }
    }
  }

  // 10. Objetos voadores (posição no mundo; escala moderada com o zoom)
  const objScale = Math.max(7, Math.min(13, w*0.011))*Math.min(3.5, Math.sqrt(view.zoom));
  const objs = [
    { on: state.showPlane, km:10, fx: ((1.1 + time*0.02) % 1.2) - 0.05, kind:'plane' },
    { on: state.showBalloon, km:2, fx: 0.30 + Math.sin(time*0.6)*0.05, yOff: Math.sin(time*1.2)*8, kind:'hot' },
    { on: state.showWeather, km:30, fx: 0.72 + Math.sin(time*0.4)*0.03, rot: Math.sin(time*0.5)*0.15, kind:'wx' },
    { on: state.showSat, km:400, fx: ((1.1 + time*0.015) % 1.2) - 0.05, kind:'sat' }
  ];
  objs.forEach(o => {
    if (!o.on) return;
    const y = yFromKm(o.km) + (o.yOff || 0);
    if (y < -60 || y > usableH + 60) return;
    const x = sxFromWorld(o.fx);
    if (x < -160 || x > w + 160) return;
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(RULER_WIDTH, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.setLineDash([]);
    if (o.kind === 'plane'){ drawContrail(x, y, objScale); drawAirplane(x, y, objScale); }
    else if (o.kind === 'hot') drawHotBalloon(x, y, objScale);
    else if (o.kind === 'wx') drawWeatherBalloon(x, y, objScale, o.rot || 0);
    else drawSatellite(x, y, objScale);
  });

  // 11. Marcador de sondagem
  const altY = yFromKm(state.alt);
  if (altY >= 0 && altY <= usableH){
    ctx.strokeStyle = '#38bdf8'; ctx.setLineDash([5,5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(RULER_WIDTH, altY); ctx.lineTo(w, altY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = 'bold 11px Segoe UI';
    const lab = '📍 ' + fmtKm(state.alt) + '  (' + tempAt(state.alt).toFixed(1) + ' °C)';
    ctx.fillStyle = 'rgba(15,23,42,.82)'; ctx.fillRect(RULER_WIDTH + 6, altY - 21, ctx.measureText(lab).width + 10, 16);
    ctx.fillStyle = '#7dd3fc'; ctx.fillText(lab, RULER_WIDTH + 11, altY - 9);
  }

  // 12. Leitura no cursor (mostra o ponto que servirá de âncora do zoom)
  if (pointer.inside && !dragging && pointer.y >= 0 && pointer.y <= usableH && pointer.x > RULER_WIDTH){
    const km = kmFromU(uAtY(pointer.y));
    const txt = (km < 0.05 ? 'superfície' : fmtKm(km)) + ' · ' + tempAt(km).toFixed(0) + ' °C';
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(RULER_WIDTH, pointer.y); ctx.lineTo(w, pointer.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 6, 0, Math.PI*2); ctx.stroke();
    ctx.font = 'bold 10px Segoe UI';
    const tw = ctx.measureText(txt).width + 12;
    const tx = pointer.x + 14 + tw > w ? pointer.x - 14 - tw : pointer.x + 14;
    ctx.fillStyle = 'rgba(15,23,42,.85)'; ctx.fillRect(tx, pointer.y - 20, tw, 16);
    ctx.fillStyle = '#e2e8f0'; ctx.fillText(txt, tx + 6, pointer.y - 8);
  }

  // 13. Régua de altitude (esquerda)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, RULER_WIDTH, usableH);
  ctx.clip();
  ctx.fillStyle = 'rgba(15,23,42,.62)';
  ctx.fillRect(0, 0, RULER_WIDTH, usableH);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(RULER_X, 0); ctx.lineTo(RULER_X, usableH); ctx.stroke();

  ctx.textAlign = 'left';
  const kmMarks = [0,5,10,20,30,40,50,60,70,80,100,150,200,300,400,500,600,700,800];
  const drawnY = [];
  [true, false].forEach(majorPass => {
    kmMarks.forEach(km => {
      const isMajor = (km % 20 === 0);
      if (isMajor !== majorPass) return;
      const y = yFromKm(km);
      if (y < -10 || y > usableH + 10) return;
      if (drawnY.some(d => Math.abs(d - y) < 11)) return;
      drawnY.push(y);
      const tickLen = isMajor ? 8 : 5;
      ctx.strokeStyle = isMajor ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.4)';
      ctx.lineWidth = isMajor ? 1.5 : 1;
      ctx.beginPath(); ctx.moveTo(RULER_X - tickLen, y); ctx.lineTo(RULER_X + tickLen, y); ctx.stroke();
      ctx.fillStyle = isMajor ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.6)';
      ctx.font = isMajor ? 'bold 10px Segoe UI' : '9px Segoe UI';
      ctx.fillText(km + (isMajor ? ' km' : ''), RULER_X + 14, y + 3);
    });
  });

  ctx.save();
  ctx.translate(12, usableH/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle = 'rgba(56,189,248,.85)';
  ctx.font = 'bold 10px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('ALTITUDE', 0, 0);
  ctx.restore();
  ctx.restore();

  // 14. Fundo da legenda
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, usableH, w, LEGEND_HEIGHT);
}

/* =====================================================================
   NÚCLEO DOS DEMAIS MÓDULOS (Circulação, Fatores, Massas, Climogramas, Síntese)
   ===================================================================== */
const MODS = {};                       // registro: MODS[id] = { build(panel), draw(), down?, move?, up? }

/* ---------- utilidades de desenho ---------- */
function drawLabel(t, x, y, o){
  o = o || {};
  ctx.font = (o.bold === false ? '' : 'bold ') + (o.size || 11) + 'px Segoe UI';
  ctx.textAlign = o.align || 'left';
  if (o.bg){
    const w = ctx.measureText(t).width, pad = o.pad === undefined ? 4 : o.pad, sz = o.size || 11;
    const bx = o.align === 'center' ? x - w/2 : (o.align === 'right' ? x - w : x);
    ctx.fillStyle = o.bg; ctx.fillRect(bx - pad, y - sz - 1, w + pad*2, sz + 6);
  }
  ctx.fillStyle = o.color || '#e2e8f0';
  ctx.fillText(t, x, y);
  ctx.textAlign = 'left';
}
function wrapText(t, x, y, maxW, lh, o){
  o = o || {};
  ctx.font = (o.bold ? 'bold ' : '') + (o.size || 11) + 'px Segoe UI';
  ctx.fillStyle = o.color || '#cbd5e1'; ctx.textAlign = o.align || 'left';
  const words = t.split(' '); let line = '', yy = y;
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; } else line = test;
  });
  if (line) ctx.fillText(line, x, yy);
  ctx.textAlign = 'left';
  return yy + lh;
}
function arrowHead(x, y, ang, size, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + Math.cos(ang)*size, y + Math.sin(ang)*size);
  ctx.lineTo(x + Math.cos(ang + 2.5)*size, y + Math.sin(ang + 2.5)*size);
  ctx.lineTo(x + Math.cos(ang - 2.5)*size, y + Math.sin(ang - 2.5)*size);
  ctx.closePath(); ctx.fill();
}
function arrowLine(x0, y0, x1, y1, color, lw, head){
  ctx.strokeStyle = color; ctx.lineWidth = lw || 2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  arrowHead(x1, y1, Math.atan2(y1 - y0, x1 - x0), head || 7, color);
}
function roundRect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function bez(p0, c, p1, n){
  n = n || 24; const out = [];
  for (let i=0; i<=n; i++){ const t = i/n, u = 1 - t;
    out.push([u*u*p0[0] + 2*u*t*c[0] + t*t*p1[0], u*u*p0[1] + 2*u*t*c[1] + t*t*p1[1]]); }
  return out;
}
/* trajeto por vários pontos de controle (Catmull-Rom) → polilinha suave */
function smoothPath(pts, seg){
  seg = seg || 10; if (pts.length < 3) return pts.slice();
  const out = [], P = [pts[0]].concat(pts, [pts[pts.length-1]]);
  for (let i=1; i<P.length-2; i++){
    for (let s=0; s<seg; s++){
      const t = s/seg, t2 = t*t, t3 = t2*t;
      const f = k => 0.5*((2*P[i][k]) + (-P[i-1][k] + P[i+1][k])*t + (2*P[i-1][k] - 5*P[i][k] + 4*P[i+1][k] - P[i+2][k])*t2 + (-P[i-1][k] + 3*P[i][k] - 3*P[i+1][k] + P[i+2][k])*t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(pts[pts.length-1]); return out;
}
function pathLengths(pts){
  const cum = [0]; for (let i=1; i<pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  return cum;
}
function pointAlong(pts, cum, t){
  const L = cum[cum.length-1]; let d = t*L, i = 1;
  while (i < cum.length-1 && cum[i] < d) i++;
  const seg = cum[i] - cum[i-1] || 1, f = (d - cum[i-1])/seg;
  const x = lerp(pts[i-1][0], pts[i][0], f), y = lerp(pts[i-1][1], pts[i][1], f);
  return [x, y, Math.atan2(pts[i][1]-pts[i-1][1], pts[i][0]-pts[i-1][0])];
}
/* Fluxo animado: traço tênue + setas que percorrem o trajeto */
function flowPath(pts, color, lw, opt){
  opt = opt || {};
  if (pts.length < 2) return;
  const cum = pathLengths(pts), L = cum[cum.length-1]; if (L < 2) return;
  const base = opt.base === undefined ? 0.35 : opt.base;
  if (base > 0){
    ctx.strokeStyle = color; ctx.globalAlpha = base*(opt.alpha === undefined ? 1 : opt.alpha); ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const n = opt.n || Math.max(2, Math.round(L/70)), sp = opt.speed || 0.10;
  for (let k=0; k<n; k++){
    const t = (time*sp*(opt.dir || 1) + k/n + (opt.phase || 0)) % 1, tt = t < 0 ? t + 1 : t;
    const p = pointAlong(pts, cum, tt);
    const fade = Math.min(1, tt*8, (1 - tt)*8);
    ctx.globalAlpha = fade*(opt.alpha === undefined ? 1 : opt.alpha);
    arrowHead(p[0], p[1], p[2] + ((opt.dir || 1) < 0 ? Math.PI : 0), opt.head || (4 + lw), color);
  }
  ctx.globalAlpha = 1;
}

/* Preenche uma silhueta (xs crescentes, heights em px acima de baseY) com luz/sombra por inclinação local. */
function shadedSilhouette(xs, heights, baseY, litC, shadeC, opt){
  opt = opt || {};
  const n = xs.length, K = opt.k || 6, gain = opt.slopeGain === undefined ? 0.05 : opt.slopeGain;
  let lit = new Float32Array(n);
  for (let i=0; i<n; i++){
    const a = Math.max(0, i-K), b = Math.min(n-1, i+K);
    const slope = (heights[a] - heights[b])/Math.max(1, xs[b] - xs[a]);
    lit[i] = clamp(0.5 + slope*gain, opt.minLit === undefined ? 0.08 : opt.minLit, 1);
  }
  for (let pass=0; pass<(opt.smooth === undefined ? 3 : opt.smooth); pass++){
    const t = new Float32Array(n);
    for (let i=0; i<n; i++) t[i] = (lit[Math.max(0,i-1)] + 2*lit[i] + lit[Math.min(n-1,i+1)])/4;
    lit = t;
  }
  for (let i=0; i<n-1; i++){
    ctx.fillStyle = rgbS(mixC(shadeC, litC, lit[i]));
    ctx.beginPath();
    ctx.moveTo(xs[i], baseY - heights[i]); ctx.lineTo(xs[i+1], baseY - heights[i+1]);
    ctx.lineTo(xs[i+1], baseY); ctx.lineTo(xs[i], baseY); ctx.closePath(); ctx.fill();
  }
  return lit;
}
/* Textura de rocha: estrias diagonais curtas, mais claras nas cristas iluminadas e escuras nas sombras. */
function rockStriations(xs, heights, baseY, lit, opt){
  opt = opt || {};
  const step = opt.step || 5, minH = opt.minH || 6;
  for (let i=0; i<xs.length; i += step){
    if (heights[i] < minH) continue;
    const y0 = baseY - heights[i], len = heights[i]*(0.12 + 0.22*hash1(xs[i]*0.11 + (opt.seed || 0)));
    const facing = lit[i] > 0.55;
    ctx.strokeStyle = facing ? 'rgba(255,250,238,' + (0.06 + 0.1*hash1(xs[i]*0.07)).toFixed(3) + ')' : 'rgba(15,12,10,' + (0.08 + 0.12*hash1(xs[i]*0.09)).toFixed(3) + ')';
    ctx.lineWidth = 1 + hash1(xs[i]*0.13)*1.4;
    ctx.beginPath(); ctx.moveTo(xs[i], y0 + len*0.08); ctx.lineTo(xs[i] - len*0.3, y0 + len); ctx.stroke();
  }
}

/* ---------- mapas esquemáticos (equirretangular, coordenadas [lon,lat]) ---------- */
function mkProj(x, y, w, h, lon0, lon1, lat0, lat1){
  return (lo, la) => [x + (lo - lon0)/(lon1 - lon0)*w, y + (lat0 - la)/(lat0 - lat1)*h];
}
function polyPath(P, proj){
  ctx.beginPath();
  P.forEach((q, i) => { const s = proj(q[0], q[1]); if (i) ctx.lineTo(s[0], s[1]); else ctx.moveTo(s[0], s[1]); });
  ctx.closePath();
}
function polyFill(P, proj, fill, stroke, lw){
  polyPath(P, proj);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function ellipseLL(cx, cy, rx, ry, proj, rot){
  const pts = [];
  for (let i=0; i<48; i++){ const a = i/48*Math.PI*2; pts.push([cx + rx*Math.cos(a), cy + ry*Math.sin(a)]); }
  return pts;
}
function pointInPoly(px, py, P){
  let ins = false;
  for (let i=0, j=P.length-1; i<P.length; j=i++){

function tintAt(stops, lat){
  for (let i=0; i<stops.length-1; i++){ const a = stops[i], b = stops[i+1];
    if (lat <= a[0] && lat >= b[0]) return mixC(a[1], b[1], (a[0]-lat)/(a[0]-b[0])); }
  return stops[stops.length-1][1];
}
function latGradient(stops, y, h, lat0, lat1){
  const g = ctx.createLinearGradient(0, y, 0, y + h), N = 16;
  for (let i=0; i<=N; i++){ const t = i/N, lat = lat0 + (lat1-lat0)*t; g.addColorStop(t, rgbS(tintAt(stops, lat))); }
  return g;
}
/* pontos de relevo pré-calculados uma única vez (evita testar polígono a cada quadro) */
function buildReliefDots(polys, nTry, seed){
  const out = [];
  for (let i=0; i<nTry; i++){
    const lo = -180 + 360*hash1(i*3.11 + seed), la = -80 + 158*hash1(i*7.73 + seed + 1);
    for (let k=0; k<polys.length; k++){ if (pointInPoly(lo, la, polys[k])){ out.push([lo, la, hash1(i*9.31 + seed + 2)]); break; } }
  }
  return out;
}
let WORLD_RELIEF = null;
function drawWorldMap(x, y, w, h, opt){
  opt = opt || {};
  if (!WORLD_RELIEF) WORLD_RELIEF = buildReliefDots(WORLD_LAND.map(k => GEO[k]), 1100, 11);
  const proj = mkProj(x, y, w, h, -180, 180, 90, -90);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = opt.sea || latGradient(SEA_TINT_STOPS, y, h, 90, -90); ctx.fillRect(x, y, w, h);
  // brilho equatorial suave na água (mar mais claro perto do Equador)
  const eq = proj(0, 0)[1];
  let eqg = ctx.createLinearGradient(0, eq - h*0.16, 0, eq + h*0.16);
  eqg.addColorStop(0, 'rgba(255,255,255,0)'); eqg.addColorStop(0.5, 'rgba(255,255,255,.10)'); eqg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = eqg; ctx.fillRect(x, y, w, h);
  const landFill = opt.land || latGradient(LAND_TINT_STOPS, y, h, 90, -90);
  WORLD_LAND.forEach(k => polyFill(GEO[k], proj, landFill, null));
  // sombra de contorno (dá volume à costa) + linha de costa
  ctx.save();
  WORLD_LAND.forEach(k => { polyPath(GEO[k], proj); ctx.clip(); });
  ctx.restore();
  WORLD_LAND.forEach(k => { polyPath(GEO[k], proj); ctx.strokeStyle = 'rgba(40,55,35,.5)'; ctx.lineWidth = 0.9; ctx.stroke(); });
  // textura de relevo (pontuado, pré-calculado)
  if (opt.relief !== false){
    WORLD_RELIEF.forEach(d => {
      const q = proj(d[0], d[1]);
      if (q[0] < x - 2 || q[0] > x + w + 2 || q[1] < y - 2 || q[1] > y + h + 2) return;
      const tone = d[2] > 0.5 ? 'rgba(255,255,255,' : 'rgba(40,45,25,';
      ctx.fillStyle = tone + (0.05 + 0.06*d[2]).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q[0], q[1], 0.9 + d[2]*0.6, 0, Math.PI*2); ctx.fill();
    });
  }
  // faixa de nuvens da ZCIT (satélite estilizado), acompanha leve deriva
  if (opt.itcz !== false){
    for (let i=0; i<26; i++){
      const lo = -180 + 360*((i/26 + time*0.006) % 1), la = 1.5*Math.sin(i*1.7 + time*0.15);
      const q = proj(lo, la);
      softEllipse(q[0], q[1], w*0.048, h*0.018, WHITE, 0.10 + 0.05*hash1(i*2.7));
    }
  }
  // mares interiores
  [[34,43.3,6,1.8],[51,41.5,1.8,4.2]].forEach(e => polyFill(ellipseLL(e[0], e[1], e[2], e[3]), proj, rgbS(tintAt(SEA_TINT_STOPS, e[1])), null));
  // vinheta suave nas bordas (norte/sul) para sugerir curvatura/atmosfera
  let vg = ctx.createLinearGradient(0, y, 0, y + h*0.14); vg.addColorStop(0, 'rgba(6,14,26,.28)'); vg.addColorStop(1, 'rgba(6,14,26,0)');
  ctx.fillStyle = vg; ctx.fillRect(x, y, w, h*0.14);
  vg = ctx.createLinearGradient(0, y + h*0.86, 0, y + h); vg.addColorStop(0, 'rgba(6,14,26,0)'); vg.addColorStop(1, 'rgba(6,14,26,.28)');
  ctx.fillStyle = vg; ctx.fillRect(x, y + h*0.86, w, h*0.14);
  // graticula suave, trópicos e círculos polares
  ctx.setLineDash([5,5]); ctx.lineWidth = 1;
  [[23.4,'Trópico de Câncer'],[0,'Equador'],[-23.4,'Trópico de Capricórnio'],[66.6,'Círculo Polar Ártico'],[-66.6,'Círculo Polar Antártico']].forEach(l => {
    const a = proj(-180, l[0]), b = proj(180, l[0]);
    ctx.strokeStyle = l[0] === 0 ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], a[1]); ctx.stroke();
    if (opt.lineLabels !== false) drawLabel(l[1], x + 6, a[1] - 3, { size: 9, color: 'rgba(255,255,255,.7)', bold: false });
  });
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
  ctx.restore();
  return proj;
}

      'Monções são ventos que <b>invertem de direção</b> com as estações. Na região do Oceano Índico:<br>' +
      '• <b>Inverno (dez–jan):</b> o oceano fica mais aquecido que o continente → <b>baixa pressão</b> sobre o oceano e alta sobre o continente → ventos <b>do continente para o oceano</b> (secos).<br>' +
      '• <b>Verão (jul–ago):</b> o aquecimento se inverte → baixa pressão sobre o continente → ventos <b>do oceano para o continente</b> (úmidos), com chuvas abundantes e médias.<br><br>' +
      '<i>Mapa esquemático, sem escala.</i>'));
  } else {
    body += cardHTML('🎛️ Controles', sliderHTML('cInten','cIntenV','Intensidade do processo', 0, 1, CIRC.inten, 0.01, '') +
      conceptHTML('Ajuste para ver quando a chuva começa em cada tipo.'));
    body += cardHTML('📖 Tipos de chuva (pág. 37)', conceptHTML(
      '<b>Convectiva:</b> o ar quente sobe na vertical e encontra uma camada de ar frio em altitude; o vapor condensa (a evapotranspiração fornece umidade).<br>' +
      '<b>Frontal:</b> encontro de uma massa de ar quente com uma fria; o ar quente é forçado a subir.<br>' +
      '<b>Orográfica:</b> o ar úmido encontra uma região elevada e sobe: chove no <b>barlavento</b>; o <b>sotavento</b> fica sem chuva.'));
  }
  p.innerHTML = body;
  bindScenes(p, s => { CIRC.scene = s; buildCirc(p); });
  bindSlider('cSeason','cSeasonV', v => v < 0.05 ? 'Janeiro' : v > 0.95 ? 'Julho' : Math.abs(v - 0.5) < 0.04 ? 'Equinócio (média)' : (v < 0.5 ? 'Jan → equinócio' : 'equinócio → Jul'), v => { CIRC.season = v; circSeasonText(); });
  if ($('cShowP')) $('cShowP').onchange = () => { CIRC.showP = $('cShowP').checked; };
  bindSlider('cHour','cHourV', v => { const h = Math.floor(v), m = Math.round((v - h)*60); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }, v => { CIRC.hour = v; });
  bindSlider('cMon','cMonV', v => v < 0.25 ? 'Inverno (dez–jan)' : v > 0.75 ? 'Verão (jul–ago)' : 'Transição', v => { CIRC.mon = v; });
  bindSlider('cInten','cIntenV', v => Math.round(v*100) + ' %', v => { CIRC.inten = v; });
}
function circShift(){ return (2*CIRC.season - 1)*8; }
function circSeasonText(){
  const el = $('cSeasonTxt'); if (!el) return;
  const d = circShift(), lat = Math.abs(d).toFixed(0);
  el.innerHTML = 'ZCIT ≈ <b>' + (Math.abs(d) < 0.5 ? '0°' : lat + '°' + (d > 0 ? 'N' : 'S')) + '</b> · ' +
    (d < -2 ? 'em janeiro a faixa de baixas pressões fica ao sul do equador.' : d > 2 ? 'em julho ela fica ao norte do equador.' : 'posição média.');
}

/* ---------------- cenas ---------------- */
function tempColor(lat, a){
  const t = Math.pow(Math.cos(lat*Math.PI/180), 1.4);           // 0 = frio (polo) … 1 = quente (equador)
  const stops = [[125,211,252],[253,230,138],[251,146,60],[239,68,68]];
  const x = t*(stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x));
  return rgbaS(mixC(stops[i], stops[i+1], x - i), a);
}
function superLoop(cx, cy, rx, ry, dir, u){
  const th = dir*(u*Math.PI*2);
  const sg = (v) => Math.sign(v)*Math.pow(Math.abs(v), 0.5);     // superelipse (n = 4)
  return [cx + rx*sg(Math.cos(th)), cy - ry*sg(Math.sin(th))];
}

function drawCircCells(){
  const X0 = 70, X1 = W - 30, gy = H*0.79, HT = H*0.60;
  const xOf = lat => X0 + (90 - lat)/180*(X1 - X0);
  const d = circShift();
  const ht = lat => HT*(0.58 + 0.42*Math.pow(Math.cos(lat*Math.PI/180), 2));   // tropopausa mais alta no equador

  // fundo por temperatura (faixas)
  for (let x = X0; x < X1; x += 4){
    const lat = 90 - (x - X0)/(X1 - X0)*180;
    ctx.fillStyle = tempColor(lat, 0.42); ctx.fillRect(x, gy - HT*1.02, 4.5, HT*1.02);
  }
  const sk = ctx.createLinearGradient(0, gy - HT*1.02, 0, gy);
  sk.addColorStop(0, 'rgba(11,18,32,.75)'); sk.addColorStop(0.5, 'rgba(11,18,32,.15)'); sk.addColorStop(1, 'rgba(11,18,32,0)');
  ctx.fillStyle = sk; ctx.fillRect(X0, gy - HT*1.02, X1 - X0, HT*1.02);
  // tropopausa
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([7,5]); ctx.lineWidth = 1.2; ctx.beginPath();
  for (let lat = 90; lat >= -90; lat -= 3){ const x = xOf(lat), y = gy - ht(lat); if (lat === 90) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
  ctx.stroke(); ctx.setLineDash([]);
  drawLabel('TROPOPAUSA (esquemática)', X0 + 8, gy - ht(90) - 8, { size: 9.5, color: 'rgba(255,255,255,.75)' });
  // solo
  const gg = ctx.createLinearGradient(0, gy, 0, gy + 34); gg.addColorStop(0, '#3f6b3a'); gg.addColorStop(1, '#22331f');
  ctx.fillStyle = gg; ctx.fillRect(X0, gy, X1 - X0, 34);

  // limites das células (deslocados com a estação)
  const B = { n90:90, n60:60 + 0.5*d, n30:30 + 0.8*d, eq:d, s30:-30 + 0.8*d, s60:-60 + 0.5*d, s90:-90 };
  const cells = [
    { a:B.eq,  b:B.n30, dir: 1, f:0.90, rise:B.eq,  sink:B.n30, name:'alísios de nordeste', up:'contra-alísios' },
    { a:B.n30, b:B.n60, dir:-1, f:0.55, rise:B.n60, sink:B.n30, name:'ventos de oeste' },
    { a:B.n60, b:B.n90, dir: 1, f:0.42, rise:B.n60, sink:B.n90, name:'ventos polares' },
    { a:B.eq,  b:B.s30, dir:-1, f:0.90, rise:B.eq,  sink:B.s30, name:'alísios de sudeste', up:'contra-alísios' },
    { a:B.s30, b:B.s60, dir: 1, f:0.55, rise:B.s60, sink:B.s30, name:'ventos de oeste' },
    { a:B.s60, b:B.s90, dir:-1, f:0.42, rise:B.s60, sink:B.s90, name:'ventos polares' }
  ];
  cells.forEach((c, ci) => {
    const xa = xOf(c.a), xb = xOf(c.b), cx = (xa + xb)/2, rx = Math.abs(xb - xa)/2 - 4;
    const hm = ht((c.a + c.b)/2)*c.f, cy = gy - 6 - hm/2, ry = hm/2;
    const loop = []; for (let i=0; i<=80; i++) loop.push(superLoop(cx, cy, rx, ry, c.dir, i/80));
    flowPath(loop, 'rgba(255,255,255,.9)', 1.6, { n:5, speed:0.06, base:0.25, head:6 });
    const xr = xOf(c.rise), xs = xOf(c.sink);
    for (let k=0; k<14; k++){
      const p = superLoop(cx, cy, rx, ry, c.dir, (time*0.06 + k/14) % 1);
      const m = clamp((p[0] - xs)/(xr - xs || 1), 0, 1);
      ctx.fillStyle = rgbaS(mixC([96,165,250],[251,113,60], m), 0.95);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI*2); ctx.fill();
    }
    drawLabel(c.name, cx, gy - 12, { size: 10.5, color: '#fff', align:'center', bg:'rgba(15,23,42,.55)' });
    if (c.up) drawLabel(c.up, cx, gy - hm - 8, { size: 9.5, color: '#fde68a', align:'center' });
  });

  // tempo característico: ZCIT (Cb + chuva), ~60° (nimbostratus), ~30° e polos (céu limpo)
  const zx = xOf(B.eq);
  cloudCb(zx, gy - 8 - 1.3*36, 36, gy);
  drawLabel('ZCIT · ar sobe · chuvas', zx, gy - ht(0)*0.98 - 8, { size: 10.5, color: '#fff', align:'center', bg:'rgba(15,23,42,.6)' });
  [B.n60, B.s60].forEach(l => { cloudNimbo(xOf(l), gy - 60, 20, gy); });
  [B.n30, B.s30, 90, -90].forEach(l => {
    const x = clamp(xOf(l), X0 + 14, X1 - 14);
    arrowLine(x, gy - ht(l)*0.45, x, gy - ht(l)*0.45 + 26, 'rgba(147,197,253,.9)', 2, 6);
  });

  // pressão em superfície
  const zones = [[90,'Alta pressão',0],[B.n60,'Baixa pressão',1],[B.n30,'Alta (subtropical)',0],[B.eq,'Baixa · ZCIT',1],[B.s30,'Alta (subtropical)',0],[B.s60,'Baixa pressão',1],[-90,'Alta pressão',0]];
  if (CIRC.showP) zones.forEach(z => {
    const x = clamp(xOf(z[0]), X0 + 44, X1 - 44), high = !z[2];
    drawLabel((high ? 'A · ' : 'B · ') + z[1], x, gy + 22, { size: 10, align:'center', color: high ? '#fbbf24' : '#7dd3fc' });
  });
  // eixo de latitudes fixas
  [90,60,30,0,-30,-60,-90].forEach(l => {
    const x = xOf(l); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(x, gy + 34); ctx.lineTo(x, gy + 42); ctx.stroke();
    drawLabel(Math.abs(l) + '°' + (l > 0 ? ' N' : l < 0 ? ' S' : ''), x, gy + 56, { size: 10, align:'center', color:'#94a3b8' });
  });
  drawLabel('Corte meridional esquemático (latitude × altitude, sem escala)', X0, gy + 78, { size: 10, color:'#94a3b8', bold:false });
  drawLabel('ar quente e leve', X1 - 4, gy - HT*1.02 + 14, { size:9.5, color:'#fca5a5', align:'right', bold:false });
}

function drawCircDisc(){
  const R = Math.min(H*0.40, W*0.27), cx = W*0.40, cy = H*0.52, d = circShift();
  const yOf = lat => cy - R*Math.sin(lat*Math.PI/180);
  const B = [90, 60 + 0.5*d, 30 + 0.8*d, d, -30 + 0.8*d, -60 + 0.5*d, -90];
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  const bands = [
    [B[0], B[1], 'rgba(147,210,250,.95)'], [B[1], B[2], 'rgba(253,230,138,.95)'], [B[2], B[3] + 4, 'rgba(251,146,110,.95)'],
    [B[3] + 4, B[3] - 4, 'rgba(220,70,40,.98)'], [B[3] - 4, B[4], 'rgba(251,146,110,.95)'], [B[4], B[5], 'rgba(253,230,138,.95)'], [B[5], B[6], 'rgba(147,210,250,.95)']
  ];
  bands.forEach(b => { ctx.fillStyle = b[2]; ctx.fillRect(cx - R, yOf(b[0]), 2*R, yOf(b[1]) - yOf(b[0])); });
  // subtropicais (altas): faixas mais fortes
  [B[2], B[4]].forEach(l => { ctx.fillStyle = 'rgba(200,80,60,.35)'; ctx.fillRect(cx - R, yOf(l + 5), 2*R, yOf(l - 5) - yOf(l + 5)); });
  // setas dos ventos (direções da figura do livro)
  const wind = [
    { a:B[0], b:B[1], v:[-0.8, 0.6] }, { a:B[1], b:B[2], v:[0.8, -0.6] }, { a:B[2], b:B[3] + 8, v:[-0.7, 0.7] },
    { a:B[3] - 8, b:B[4], v:[-0.7, -0.7] }, { a:B[4], b:B[5], v:[0.8, 0.6] }, { a:B[5], b:B[6], v:[-0.8, -0.6] }
  ];
  wind.forEach(wd => {
    const ym = (yOf(wd.a) + yOf(wd.b))/2, half = Math.sqrt(Math.max(0, R*R - (ym - cy)*(ym - cy)));
    const rows = Math.max(1, Math.round(Math.abs(yOf(wd.b) - yOf(wd.a))/34));
    for (let r=0; r<rows; r++){
      const yy = yOf(wd.a) + (r + 0.5)/rows*(yOf(wd.b) - yOf(wd.a));
      const hw = Math.sqrt(Math.max(0, R*R - (yy - cy)*(yy - cy))) - 14;
      for (let x = cx - hw + 25; x < cx + hw - 20; x += 62){
        flowPath([[x, yy], [x + wd.v[0]*46, yy + wd.v[1]*46]], '#1e293b', 1.6, { n:1, speed:0.22, base:0.55, head:5, phase:(x*0.013 + r*0.3) });
      }
    }
  });
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  // tropicos e círculos (fixos)
  [[23.44,'Trópico de Câncer'],[-23.44,'Trópico de Capricórnio'],[66.56,'Círculo polar Ártico'],[-66.56,'Círculo polar Antártico']].forEach(l => {
    const y = yOf(l[0]), hw = Math.sqrt(R*R - (y - cy)*(y - cy));
    ctx.setLineDash([5,4]); ctx.strokeStyle = 'rgba(15,23,42,.65)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - hw, y); ctx.lineTo(cx + hw, y); ctx.stroke(); ctx.setLineDash([]);
    drawLabel(l[1], cx + hw + 10, y + 4, { size: 10, color:'#94a3b8', bold:false });
  });
  // nomes dos ventos (direita) e zonas de pressão
  const names = [[(B[0]+B[1])/2,'Ventos polares'],[(B[1]+B[2])/2,'Ventos de oeste'],[(B[2]+B[3])/2,'Alísios de nordeste'],[(B[3]+B[4])/2,'Alísios de sudeste'],[(B[4]+B[5])/2,'Ventos de oeste'],[(B[5]+B[6])/2,'Ventos polares']];
  names.forEach(n => {
    const y = yOf(n[0]), hw = Math.sqrt(Math.max(0, R*R - (y - cy)*(y - cy)));
    ctx.strokeStyle = 'rgba(148,163,184,.6)'; ctx.beginPath(); ctx.moveTo(cx + hw*0.7, y); ctx.lineTo(cx + R*1.02 + 16, y); ctx.stroke();
    drawLabel(n[1], cx + R*1.02 + 22, y + 4, { size: 11.5, color:'#e2e8f0' });
  });
  if (CIRC.showP){
    drawLabel('Zona intertropical de convergência (baixas pressões)', cx, yOf(B[3]) + 4, { size: 10, color:'#fff', align:'center' });
    drawLabel('Zona de altas pressões subtropicais', cx, yOf(B[2]) + 15, { size: 9.5, color:'#7f1d1d', align:'center' });
    drawLabel('Zona de altas pressões subtropicais', cx, yOf(B[4]) - 6, { size: 9.5, color:'#7f1d1d', align:'center' });
    drawLabel('Zona de baixa pressão', cx, yOf(B[1]) + 16, { size: 10, color:'#78350f', align:'center' });
    drawLabel('Zona de baixa pressão', cx, yOf(B[5]) - 8, { size: 10, color:'#78350f', align:'center' });
    drawLabel('Alta pressão', cx, yOf(90) + 20, { size: 10, color:'#0c4a6e', align:'center' });
    drawLabel('Alta pressão', cx, yOf(-90) - 10, { size: 10, color:'#0c4a6e', align:'center' });
  }
  [[90,'90°'],[60,'60°'],[30,'30°'],[0,'0°'],[-30,'30°'],[-60,'60°'],[-90,'90°']].forEach(l => {
    const y = yOf(l[0]), hw = Math.sqrt(Math.max(0, R*R - (y - cy)*(y - cy)));
    drawLabel(l[1], cx - hw - 8, y + 4, { size: 11, color:'#cbd5e1', align:'right' });
  });
  drawLabel('Vista de cima: direções dos ventos à superfície (esquema)', 18, H - 18, { size: 10, color:'#94a3b8', bold:false });
}

function drawCircBreeze(){
  const xL = 70, xR = W - 60, top = H*0.16, gy = H*0.72;
  const kmX = k => xL + (k + 45)/90*(xR - xL), hY = h => gy - h/2.2*(gy - top);
  const hr = CIRC.hour, day = Math.sin(Math.PI*(hr - 6)/12);
  // céu por hora
  const dl = clamp(day*1.4 + 0.25, 0, 1);
  const sk = ctx.createLinearGradient(0, top - 30, 0, gy);
  sk.addColorStop(0, rgbS(mixC([8,14,40],[92,164,232], dl))); sk.addColorStop(1, rgbS(mixC([18,28,58],[190,224,247], dl)));
  ctx.fillStyle = sk; ctx.fillRect(xL, top - 30, xR - xL, gy - top + 30);
  // astro
  const ang = Math.PI*(hr - 6)/12, sunUp = hr >= 6 && hr <= 18;
  const ax = kmX(0) + Math.cos(Math.PI - ang)*(xR - xL)*0.36, ay = gy - 20 - Math.abs(Math.sin(ang))*(gy - top)*0.9;
  if (sunUp){ drawSun(ax, ay); } else {
    const na = Math.PI*(((hr + 6) % 24) - 6)/12; const mx = kmX(0) + Math.cos(Math.PI - na)*(xR - xL)*0.36, my = gy - 20 - Math.abs(Math.sin(na))*(gy - top)*0.9;
    ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(mx, my, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(8,14,40,.9)'; ctx.beginPath(); ctx.arc(mx + 6, my - 3, 12, 0, Math.PI*2); ctx.fill();
  }
  // grade de altura
  [0,1,2].forEach(k => {
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xL, hY(k)); ctx.lineTo(xR, hY(k)); ctx.stroke();
    drawLabel(k + ' km', xL - 8, hY(k) + 4, { size: 10, color:'#94a3b8', align:'right' });
  });
  // terreno e mar
  const coast = kmX(0);
  ctx.fillStyle = '#9a6b3f'; ctx.beginPath(); ctx.moveTo(xL, H); ctx.lineTo(xL, hY(0.32));
  for (let x = xL; x <= coast; x += 10){ const f = 1 - (x - xL)/(coast - xL); ctx.lineTo(x, hY(0.02 + 0.30*f*f)); }
  ctx.lineTo(coast + 10, hY(-0.06)); ctx.lineTo(xR, hY(-0.06)); ctx.lineTo(xR, H); ctx.closePath(); ctx.fill();
  const sea = ctx.createLinearGradient(0, hY(0), 0, hY(-0.5)); sea.addColorStop(0, '#2b8cc4'); sea.addColorStop(1, '#1e5a86');
  ctx.fillStyle = sea; ctx.beginPath(); ctx.moveTo(coast + 10, hY(-0.06)); ctx.lineTo(xR, hY(-0.06)); ctx.lineTo(xR, hY(-0.6)); ctx.lineTo(coast + 40, hY(-0.6)); ctx.closePath(); ctx.fill();
  drawLabel('MAR', kmX(30), hY(-0.3), { size: 14, color:'#e0f2fe', align:'center' });
  drawLabel('TERRA', kmX(-30), hY(-0.3), { size: 14, color:'#fde68a', align:'center' });
  // temperaturas ilustrativas e vento
  const Tl = 24 + 7*Math.sin(2*Math.PI*(hr - 9)/24), Ts = 24 + 1*Math.sin(2*Math.PI*(hr - 11)/24);
  const dT = Tl - Ts, s = clamp(dT/5, -1, 1);
  const warmX = s >= 0 ? -20 : 16, coolX = s >= 0 ? 34 : -34;
  const hh = 0.55 + 0.85*Math.abs(s);
  const surf = [[coolX, 0.14],[(coolX + warmX)/2, 0.14],[warmX, 0.16],[warmX, hh*0.5],[warmX, hh],[(coolX + warmX)/2, hh],[coolX, hh],[coolX, hh*0.5],[coolX, 0.14]];
  const path = smoothPath(surf.map(q => [kmX(q[0]), hY(q[1])]), 8);
  const al = clamp(Math.abs(s)*1.4, 0.12, 1);
  flowPath(path, '#ffffff', 2.4, { n:5, speed:0.07*(0.4 + Math.abs(s)), base:0.4*al, alpha:al, head:7 });
  // coluna quente e pressão
  const wg = ctx.createLinearGradient(0, hY(0), 0, hY(hh)); wg.addColorStop(0, rgbaS([251,113,60], 0.35*al)); wg.addColorStop(1, rgbaS([251,113,60], 0));
  ctx.fillStyle = wg; ctx.fillRect(kmX(warmX - 8), hY(hh), kmX(warmX + 8) - kmX(warmX - 8), hY(0) - hY(hh));
  drawLabel('B', kmX(warmX), hY(0) - 8, { size: 15, color:'#7dd3fc', align:'center', bg:'rgba(15,23,42,.55)' });
  drawLabel('A', kmX(coolX), hY(0) - 8, { size: 15, color:'#fbbf24', align:'center', bg:'rgba(15,23,42,.55)' });
  // nuvens
  if (s > 0.3) cloudCumulus(kmX(warmX - 4), hY(0.95 + 0.4*s), 20 + 16*s);
  if (s < -0.3) cloudCumulus(kmX(warmX + 2), hY(0.7 + 0.3*(-s)), 12 + 10*(-s));
  // termômetros
  const thermo = (x, T, lab, col) => {
    ctx.fillStyle = 'rgba(15,23,42,.8)'; roundRect(x - 50, top + 6, 100, 46, 8); ctx.fill();
    drawLabel(lab, x, top + 22, { size: 10, color:'#94a3b8', align:'center', bold:false });
    drawLabel(T.toFixed(1) + ' °C', x, top + 44, { size: 16, color: col, align:'center' });
  };
  thermo(kmX(-33), Tl, 'Terra (ilustrativo)', '#fb923c'); thermo(kmX(33), Ts, 'Mar (ilustrativo)', '#38bdf8');
  // eixo km
  [-40,-20,0,20,40].forEach(k => drawLabel(Math.abs(k) + ' km', kmX(k), H - 12, { size: 10, color:'#94a3b8', align:'center' }));
  const label = Math.abs(s) < 0.15 ? 'Transição: terra e mar com temperaturas parecidas (calmaria)' : (s > 0 ? 'BRISA MARÍTIMA — do mar para a terra (dia)' : 'BRISA TERRESTRE — da terra para o mar (noite)');
  drawLabel(label, (xL + xR)/2, top - 10, { size: 13, color:'#fff', align:'center', bg:'rgba(15,23,42,.7)', pad: 8 });
  const tx = $('cBreezeTxt'); if (tx) tx.innerHTML = 'Terra − mar = <b>' + dT.toFixed(1) + ' °C</b> · o ar sobe sobre a superfície <b>mais quente</b> e o vento sopra à superfície em direção a ela.';
}

/* Ásia monçônica: mapa esquemático em coordenadas normalizadas 0..1 */
const MON_LAND = [[0,0],[1,0],[1,0.72],[0.93,0.55],[0.86,0.36],[0.75,0.30],[0.66,0.36],[0.60,0.52],[0.48,0.72],[0.42,0.80],[0.36,0.70],[0.28,0.52],[0.20,0.38],[0.10,0.34],[0,0.32]];
const MON_RAIN_ABUND = [[0.22,0.36],[0.30,0.34],[0.44,0.30],[0.56,0.30],[0.60,0.42],[0.50,0.62],[0.42,0.78],[0.36,0.66],[0.28,0.50]];
const MON_RAIN_MED = [[0.62,0.30],[0.74,0.29],[0.87,0.34],[0.94,0.52],[0.99,0.70],[0.90,0.62],[0.80,0.50],[0.68,0.42]];
function drawCircMonsoon(){
  const mw = Math.min(W - 300, (H - 100)*1.2), mh = mw/1.2, mx = 40, my = 60;
  const P = (u, v) => [mx + u*mw, my + v*mh];
  const m = smooth01(CIRC.mon);
  const sea = ctx.createLinearGradient(0, my, 0, my + mh); sea.addColorStop(0, '#2b8cc4'); sea.addColorStop(1, '#1e5a86');
  ctx.fillStyle = sea; roundRect(mx, my, mw, mh, 10); ctx.fill();
  ctx.save(); roundRect(mx, my, mw, mh, 10); ctx.clip();
  const proj = (u, v) => P(u, v);
  polyFill(MON_LAND, proj, '#e6c78a', 'rgba(60,50,30,.6)', 1);
  // pressão: inverno = alta no continente; verão = baixa no continente
  const grad = ctx.createRadialGradient(...P(0.5, 0.1), 5, ...P(0.5, 0.1), mw*0.42);
  grad.addColorStop(0, rgbaS(mixC([249,115,22],[56,189,248], m), 0.55)); grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad; ctx.fillRect(mx, my, mw, mh*0.6);
  // chuvas (verão)
  if (m > 0.05){ polyFill(MON_RAIN_ABUND, proj, rgbaS([250,204,21], 0.85*m), null); polyFill(MON_RAIN_MED, proj, rgbaS([34,197,94], 0.8*m), null); }
  // Himalaia
  const him = []; for (let i=0; i<=30; i++){ const u = i/30; him.push(P(u, 0.2 + 0.07*Math.sin(u*Math.PI*1.4 - 0.2) - 0.04*u)); }
  ctx.strokeStyle = '#7c4a24'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); him.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke();
  drawLabel('Himalaia', ...P(0.72, 0.16), { size: 11, color:'#fde68a' });
  // ventos: inverno (alaranjado, continente → oceano) e verão (azul, oceano → continente)
  const win = [[[0.42,0.30],[0.30,0.50],[0.18,0.66]],[[0.52,0.34],[0.44,0.55],[0.36,0.80]],[[0.70,0.36],[0.62,0.58],[0.55,0.86]],[[0.86,0.42],[0.80,0.64],[0.72,0.88]]];
  win.forEach(w => flowPath(smoothPath(w.map(q => P(q[0], q[1])), 10), '#fb923c', 3.2, { n:3, speed:0.10, alpha:1 - m, base:0.5 }));
  win.forEach(w => flowPath(smoothPath(w.slice().reverse().map(q => P(q[0], q[1])), 10), '#7dd3fc', 3.2, { n:3, speed:0.10, alpha:m, base:0.5 }));
  ctx.restore();
  drawLabel('Oceano Índico', ...P(0.16, 0.90), { size: 14, color:'#e0f2fe' });
  drawLabel(m < 0.5 ? 'MONÇÕES DE INVERNO (dez–jan)' : 'MONÇÕES DE VERÃO (jul–ago)', mx + mw/2, my - 18, { size: 14, color:'#fff', align:'center' });
  const bx = mx + mw*0.42, by = my + mh*0.05;
  const bubble = m < 0.5 ? ['Alta pressão','#f97316'] : ['Baixa pressão','#0ea5e9'];
  ctx.fillStyle = bubble[1]; roundRect(bx - 5, by, 130, 30, 15); ctx.fill(); drawLabel(bubble[0], bx + 60, by + 20, { size: 12, color:'#fff', align:'center' });
  // legenda
  const lx = mx + mw + 26;
  drawLabel('Ventos', lx, my + 12, { size: 12, color:'#e2e8f0' });
  arrowLine(lx, my + 34, lx + 34, my + 34, '#fb923c', 3, 7); drawLabel('inverno: secos, do continente', lx + 42, my + 38, { size: 10.5, bold:false });
  arrowLine(lx, my + 58, lx + 34, my + 58, '#7dd3fc', 3, 7); drawLabel('verão: úmidos, do oceano', lx + 42, my + 62, { size: 10.5, bold:false });
  ctx.fillStyle = '#facc15'; ctx.fillRect(lx, my + 84, 18, 12); drawLabel('região de chuvas abundantes', lx + 26, my + 95, { size: 10.5, bold:false });
  ctx.fillStyle = '#22c55e'; ctx.fillRect(lx, my + 106, 18, 12); drawLabel('região de chuvas médias', lx + 26, my + 117, { size: 10.5, bold:false });
  wrapText('No verão, o continente aquecido cria baixa pressão e “puxa” o ar úmido do oceano; no inverno, o quadro se inverte.', lx, my + 150, W - lx - 20, 15, { size: 11 });
  noteTag('Mapa esquemático, sem escala.', mx, my + mh + 16);
  const tx = $('cMonTxt'); if (tx) tx.innerHTML = m < 0.5 ? 'Alta pressão sobre o continente → ventos <b>secos</b> para o oceano.' : 'Baixa pressão sobre o continente → ventos <b>úmidos</b> do oceano → chuvas.';
}

function drawCircRain(){
  const I = CIRC.inten, PW = 330, PH = 540;
  const k = Math.min((W - 40)/(3*PW + 20), (H - 130)/PH);
  const ox = (W - (3*PW + 20)*k)/2, oy = 62;
  const gy = 400, top = 56;
  const titles = ['CHUVA CONVECTIVA','CHUVA FRONTAL','CHUVA OROGRÁFICA'];
  for (let i=0; i<3; i++){
    ctx.save(); ctx.translate(ox + i*(PW + 10)*k, oy); ctx.scale(k, k);
    ctx.fillStyle = 'rgba(148,197,240,.16)'; roundRect(0, 0, PW, PH, 12); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
    drawLabel(titles[i], PW/2, 26, { size: 14, color:'#fff', align:'center' });
    const cx = PW/2;
    if (i === 0){
      ctx.fillStyle = '#4b8a3a'; ctx.fillRect(0, gy, PW, 70);
      ctx.fillStyle = '#2b8cc4'; ctx.beginPath(); ctx.ellipse(cx - 40, gy + 6, 78, 10, 0, 0, Math.PI*2); ctx.fill();
      for (let t = 0; t < 4; t++){ const tx = cx + 60 + t*22; ctx.fillStyle = '#166534'; ctx.beginPath(); ctx.moveTo(tx, gy - 32); ctx.lineTo(tx - 10, gy + 2); ctx.lineTo(tx + 10, gy + 2); ctx.fill(); }
      [-50, 10, 60].forEach((dx, j) => {
        flowPath(smoothPath([[cx + dx, gy - 4], [cx + dx + 8, gy - 70], [cx + dx - 8, gy - 140], [cx + dx + 4, gy - 205]], 8), '#f97316', 3, { n:3, speed:0.10, base:0.25 + 0.4*I, alpha:0.4 + 0.6*I, phase:j*0.3 });
      });
      drawLabel('evapotranspiração', cx - 40, gy + 30, { size: 11, color:'#e0f2fe', align:'center', bold:false });
      drawLabel('ar quente sobe', cx + 92, gy - 100, { size: 11, color:'#fdba74', bold:false, align:'center' });
      const s = 14 + 22*I;
      cloudCb(cx, gy - 232 - 0.6*s, s, I > 0.4 ? gy : -9999);
      drawLabel('condensação', cx, top + 22, { size: 11, color:'#cbd5e1', align:'center', bold:false });
      wrapText('O ar quente sobe na vertical e encontra ar frio em altitude.', 16, gy + 96, PW - 32, 14, { size: 11, color:'#94a3b8' });
    } else if (i === 1){
      ctx.fillStyle = '#4b8a3a'; ctx.fillRect(0, gy, PW, 70);
      const fx = cx + 30 - 70*I;
      ctx.fillStyle = 'rgba(96,165,250,.38)'; ctx.beginPath(); ctx.moveTo(8, gy); ctx.lineTo(8, gy - 190); ctx.lineTo(cx - 20, gy - 190); ctx.lineTo(fx, gy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(251,113,60,.30)'; ctx.beginPath(); ctx.moveTo(PW - 8, gy); ctx.lineTo(PW - 8, gy - 190); ctx.lineTo(cx - 20, gy - 190); ctx.lineTo(fx, gy); ctx.closePath(); ctx.fill();
      flowPath([[22, gy - 110], [cx - 50, gy - 90], [fx + 10, gy - 40]], '#60a5fa', 4, { n:3, speed:0.08, base:0.5 });
      flowPath([[PW - 22, gy - 140], [cx + 40, gy - 130], [cx - 5, gy - 160]], '#f97316', 4, { n:3, speed:0.08, base:0.5 });
      drawLabel('ar frio', 40, gy - 150, { size: 12, color:'#93c5fd' }); drawLabel('ar quente', PW - 70, gy - 170, { size: 12, color:'#fdba74' });
      cloudNimbo(cx - 5, gy - 100, 24, I > 0.35 ? gy : -9999);
      cloudCumulus(cx + 60, gy - 150, 14);
      drawLabel('encontro de massas de ar', cx, top + 22, { size: 11, color:'#cbd5e1', align:'center', bold:false });
      wrapText('Uma massa de ar quente encontra uma fria e é forçada a subir.', 16, gy + 96, PW - 32, 14, { size: 11, color:'#94a3b8' });
    } else {
      ctx.fillStyle = '#2b8cc4'; ctx.fillRect(0, gy, 90, 70);
      const px = PW*0.66, py = gy - 170;
      ctx.fillStyle = '#8b6b4a'; ctx.beginPath(); ctx.moveTo(90, gy + 70); ctx.lineTo(90, gy); ctx.lineTo(px, py); ctx.lineTo(PW, gy); ctx.lineTo(PW, gy + 70); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 16, py + 30); ctx.lineTo(px + 16, py + 30); ctx.fill();
      flowPath(smoothPath([[14, gy - 30], [100, gy - 46], [px - 46, gy - 120], [px + 4, gy - 200]], 8), '#7dd3fc', 4, { n:3, speed:0.08, base:0.5 });
      flowPath(smoothPath([[px + 10, gy - 200], [px + 60, gy - 170], [PW - 16, gy - 120]], 8), '#e2e8f0', 3, { n:2, speed:0.08, base:0.3, alpha:0.7 });
      drawLabel('vento úmido do mar', 12, gy - 56, { size: 11, color:'#7dd3fc' });
      cloudNimbo(px - 50, gy - 150, 19, -9999);
      if (I > 0.3) rainShaft(px - 50, 19, gy - 138, gy - 60, 22, false);
      drawLabel('BARLAVENTO', px - 58, gy + 26, { size: 11, color:'#93c5fd', align:'center' });
      drawLabel('(com chuva)', px - 58, gy + 40, { size: 10, color:'#93c5fd', align:'center', bold:false });
      drawLabel('SOTAVENTO', px + 48, gy + 26, { size: 11, color:'#fcd34d', align:'center' });
      drawLabel('(sem chuva)', px + 48, gy + 40, { size: 10, color:'#fcd34d', align:'center', bold:false });
      drawLabel('encontro do ar com o relevo', cx, top + 22, { size: 11, color:'#cbd5e1', align:'center', bold:false });
      wrapText('O ar úmido sobe ao encontrar uma região elevada e a chuva cai no lado voltado ao vento.', 16, gy + 96, PW - 32, 14, { size: 11, color:'#94a3b8' });
    }
    ctx.restore(); ctx.restore();
  }
  noteTag('Esquemas baseados na figura “Tipos de chuva” (pág. 37).', ox, H - 14);
}

function drawCirc(){
  drawModuleBg();
  const sc = CIRC.scene;
  if (sc === 'celulas'){ drawTitle('Células de circulação e ventos', 'Ar aquecido sobe (baixa pressão); ar frio desce (alta pressão) — pág. 37'); drawCircCells(); }
  else if (sc === 'superficie'){ drawTitle('Circulação geral: ventos à superfície', 'Zonas de pressão e direção dos ventos — pág. 37'); drawCircDisc(); }
  else if (sc === 'brisas'){ drawTitle('Brisas marítima e terrestre', 'Circulação local diária — pág. 38'); drawCircBreeze(); }
  else if (sc === 'moncoes'){ drawTitle('Monções na região do Oceano Índico', 'Inversão sazonal dos ventos — exercício 3, pág. 44'); drawCircMonsoon(); }
  else { drawTitle('Tipos de chuva', 'Convectiva, frontal e orográfica — pág. 37'); drawCircRain(); }
}
