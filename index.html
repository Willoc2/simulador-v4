function buildFat(p){
  const scenes = [['latitude','📐 Latitude'],['altitude','🏔️ Altitude'],['correntes','🌊 Correntes marítimas'],['maritimidade','🏖️ Maritimidade'],['relevo','⛰️ Relevo']];
  let body = cardHTML('🧭 Fatores do clima', sceneButtons(scenes, FAT.scene, '#a3e635'));
  const sc = FAT.scene;
  if (sc === 'latitude'){
    body += cardHTML('🎛️ Controles',
      sliderHTML('fLat','fLatV','Latitude', 0, 90, FAT.lat, 1, '') +
      '<div class="layer-grid"><button class="layer-btn" data-lat="0" style="color:#facc15">0°</button><button class="layer-btn" data-lat="45" style="color:#facc15">45°</button><button class="layer-btn" data-lat="60" style="color:#facc15">60°</button></div>' +
      conceptHTML('<span id="fLatTxt"></span><br><i>Também dá para clicar na Terra para escolher a latitude.</i>'));
    body += cardHTML('📖 Latitude (pág. 39)', conceptHTML(
      'Perto do equador os raios solares chegam a ~90° o ano todo: muita energia por área e as <b>maiores temperaturas</b>. ' +
      'Com o aumento da latitude os raios ficam <b>oblíquos</b> e a mesma energia se espalha por uma área maior — o aquecimento diminui.<br><br>' +
      'Por isso a Terra se divide em <b>zonas</b> (tropical, temperadas, polares). Quanto menor a latitude, maiores as temperaturas médias e a chuva, e menores a variação da duração de dias e noites e a <b>amplitude térmica anual</b> ' +
      '(diferença entre a temperatura média do mês mais quente e a do mês mais frio).'));
  } else if (sc === 'altitude'){
    body += cardHTML('🎛️ Controles',
      sliderHTML('fBase','fBaseV','Temperatura ao nível do mar', 15, 40, FAT.base, 0.5, '') +
      sliderHTML('fAlt','fAltV','Altitude do observador', 0, 4500, FAT.alt, 50, '') +

      'Quanto mais alto o lugar, menor a presença de gases atmosféricos e <b>menor a retenção de calor</b>. Há relação direta entre o aumento da altitude e a queda da temperatura: em média, <b>0,65 °C a cada 100 m</b>.<br><br>' +

    body += cardHTML('📖 Correntes marítimas (pág. 40)', conceptHTML(
      'São grandes porções de água que se movem de modo mais ou menos independente da massa de água total, como “rios” no oceano, e têm dinâmica de circulação em <b>grandes células</b>. Fundamentais na redistribuição de calor do planeta.<br><br>' +

function fatGlobeTexture(R){

  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const g2 = cv.getContext('2d'), r = size/2;
  const eg = g2.createRadialGradient(r*0.58, r*0.65, r*0.08, r, r, r*1.05);
  eg.addColorStop(0, '#4a9bd4'); eg.addColorStop(0.55, '#1f6fa8'); eg.addColorStop(1, '#0a2c50');
  g2.fillStyle = eg; g2.beginPath(); g2.arc(r, r, r, 0, Math.PI*2); g2.fill();
  g2.save(); g2.beginPath(); g2.arc(r, r, r, 0, Math.PI*2); g2.clip();
  const step = size > 260 ? 3 : 2;
  for (let py = 0; py < size; py += step){

      if (v > 1.02){ g2.fillStyle = 'rgba(96,150,74,.92)'; g2.fillRect(px, py, step+0.6, step+0.6); }
      else if (v > 0.93){ g2.fillStyle = 'rgba(158,176,96,.78)'; g2.fillRect(px, py, step+0.6, step+0.6); }
    }
  }
  g2.restore();
  FAT_GLOBE_TEX = cv; FAT_GLOBE_R = size;
  return cv;
}

function altProfile(x01){   // altura (m) do perfil em x normalizado 0..1
  if (x01 < 0.22) return 0;
  const t = (x01 - 0.22)/0.78;
  const base = 4300*Math.pow(Math.sin(Math.min(1, t*1.35)*Math.PI*0.5), 1.4)*(t < 0.74 ? 1 : Math.max(0, 1 - (t - 0.74)*3.6));
  return Math.max(0, base + 160*Math.sin(t*23)*Math.min(1, t*3));
}

function drawFatRelief(){
  const U = FAT.relU*(FAT.coldCur ? 0.35 : 1);
  const top = 90, gy = H*0.80, ppm = (gy - top)*0.86/4000;         // px por metro
  const mx0 = W*0.30, mx1 = W*0.92, pk = W*0.62;
  const sky = ctx.createLinearGradient(0, top, 0, gy); sky.addColorStop(0, '#3b6db0'); sky.addColorStop(1, '#bfe3f7');
  ctx.fillStyle = sky; ctx.fillRect(0, top - 20, W, gy - top + 20);
  // mar
  ctx.fillStyle = FAT.coldCur ? '#3b6fa0' : '#2b8cc4'; ctx.fillRect(0, gy, W*0.3, 80);
  if (FAT.coldCur){ flowPath([[10, gy + 40],[W*0.15, gy + 42],[W*0.3, gy + 40]], '#a78bfa', 3, { n:3, speed:0.09 }); drawLabel('corrente fria (pouca evaporação)', 14, gy + 68, { size: 11, color:'#ddd6fe' }); }
  const hpx = FAT.relH*ppm;
  const rainWind = clamp((FAT.relH - 700)/2600, 0, 1)*U, rainLee = rainWind*0.10;
  // montanha (perfil com ruído), vegetação e neve recortadas pela silhueta
  const prof = []; for (let i=0; i<=80; i++){ const x = lerp(mx0 - 40, mx1, i/80);
    const sh = x < pk ? Math.pow(Math.max(0, (x - mx0)/(pk - mx0)), 1.12) : Math.pow(Math.max(0, (mx1 - x)/(mx1 - pk)), 0.92);
    prof.push([x, gy - hpx*sh*(1 + 0.10*(fbm(x*0.018, 5, 7) - 0.5))]); }
  const mpath = () => { ctx.beginPath(); ctx.moveTo(mx0 - 40, gy + 80); prof.forEach(q => ctx.lineTo(q[0], q[1])); ctx.lineTo(mx1, gy + 80); ctx.closePath(); };
  const relXs = prof.map(q => q[0]), relHs = prof.map(q => gy - q[1]);
  const relLit = shadedSilhouette(relXs, relHs, gy + 80, ROCK_LIT, ROCK_SH, { slopeGain:0.05, k:5 });
  mpath(); ctx.save(); ctx.clip(); rockStriations(relXs, relHs, gy + 80, relLit, { seed:9, step:3 }); ctx.restore();
  ctx.save(); mpath(); ctx.clip();
  const gcol = mixC([176,146,96],[34,120,60], clamp(rainWind*1.3, 0, 1)), lcol = mixC([176,146,96],[34,120,60], clamp(rainLee*6, 0, 1));
  let vg = ctx.createLinearGradient(mx0, 0, pk, 0); vg.addColorStop(0, rgbaS(gcol, 0.95)); vg.addColorStop(1, rgbaS(gcol, 0));
  ctx.fillStyle = vg; ctx.fillRect(mx0 - 40, gy - hpx*0.62, pk - mx0 + 40, hpx*0.62 + 80);
  vg = ctx.createLinearGradient(mx1, 0, pk, 0); vg.addColorStop(0, rgbaS(lcol, 0.95)); vg.addColorStop(1, rgbaS(lcol, 0));
  ctx.fillStyle = vg; ctx.fillRect(pk, gy - hpx*0.62, mx1 - pk, hpx*0.62 + 80);
  if (FAT.relH > 2600){ ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fillRect(mx0 - 40, 0, mx1 - mx0 + 40, gy - hpx + (FAT.relH - 2600)*ppm); }
  ctx.restore();
  // vento úmido
  const flow = smoothPath([[20, gy - 70],[mx0 - 30, gy - 90],[pk - (pk - mx0)*0.45, gy - hpx*0.55 - 30],[pk, gy - hpx - 40]], 8);
  flowPath(flow, '#7dd3fc', 4, { n:4, speed:0.08, base:0.5, alpha:0.4 + 0.6*U });
  if (FAT.relH < 600) flowPath([[pk, gy - hpx - 40],[mx1, gy - hpx - 30]], '#7dd3fc', 3, { n:2, speed:0.08, base:0.4, alpha:0.7 });
  else flowPath(smoothPath([[pk, gy - hpx - 40],[pk + 90, gy - hpx - 10],[mx1 - 20, gy - 130]], 8), '#e2e8f0', 3, { n:2, speed:0.08, base:0.3, alpha:0.7 });
  // nuvem e chuva no barlavento
  if (rainWind > 0.03){
    const cxn = pk - (pk - mx0)*0.42, cyn = gy - hpx*0.72 - 30;
    cloudNimbo(cxn, cyn, 22 + 26*rainWind, -9999);
    rainShaft(cxn, 22 + 26*rainWind, cyn + 12, gy - hpx*0.30, 30*rainWind + 12, false);
  }
  // barras de precipitação (ilustrativo)
  const bx = W*0.05, by = 120;
  ctx.fillStyle = 'rgba(15,23,42,.8)'; roundRect(bx - 10, by - 30, 250, 140, 10); ctx.fill();
  drawLabel('Chuva (índice ilustrativo)', bx, by - 10, { size: 11.5, color:'#e2e8f0' });
  drawLabel('barlavento', bx, by + 20, { size: 11, color:'#93c5fd', bold:false }); ctx.fillStyle = '#60a5fa'; ctx.fillRect(bx + 80, by + 8, rainWind*140, 14);
  drawLabel('sotavento', bx, by + 52, { size: 11, color:'#fcd34d', bold:false }); ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 80, by + 40, rainLee*140, 14);
  drawLabel(rainLee < 0.03 && FAT.relH > 1500 ? 'tendência a região árida no sotavento' : (FAT.relH < 700 ? 'montanha baixa: o ar úmido passa' : 'montanha barra o ar úmido'), bx, by + 88, { size: 10.5, color:'#cbd5e1', bold:false });
  drawLabel('BARLAVENTO', pk - (pk - mx0)*0.5, gy + 28, { size: 12, color:'#93c5fd', align:'center' });
  drawLabel('SOTAVENTO', pk + (mx1 - pk)*0.5, gy + 28, { size: 12, color:'#fcd34d', align:'center' });
  drawLabel(FAT.relH + ' m', pk, gy - hpx - 52, { size: 12, color:'#fff', align:'center', bg:'rgba(15,23,42,.75)', pad:4 });
  const tx = $('fRelTxt'); if (tx) tx.innerHTML = 'Barlavento: <b>' + (rainWind > 0.5 ? 'chuvoso' : rainWind > 0.1 ? 'chuva moderada' : 'pouca chuva') + '</b> · Sotavento: <b>' + (rainLee < 0.05 ? 'seco' : 'menos chuva') + '</b>.';
  noteTag('Esquema ilustrativo (a chuva orográfica está descrita nas págs. 37 e 41).', 20, H - 14);
}

    });

}

function drawMasMundo(){

    const c = proj(m.lon, m.lat), rr = Math.max(20, (Math.max.apply(null, pts.map(q=>q[0])) - Math.min.apply(null, pts.map(q=>q[0])))/2);
    const rg = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], rr);
    rg.addColorStop(0, rgbaS(col, on ? 0.55 : 0.30)); rg.addColorStop(0.75, rgbaS(col, on ? 0.32 : 0.14)); rg.addColorStop(1, rgbaS(col, 0));
    ctx.save(); ctx.clip(); ctx.fillStyle = rg; ctx.fillRect(c[0]-rr, c[1]-rr, rr*2, rr*2); ctx.restore();
    ctx.strokeStyle = rgbaS(col, on ? 0.95 : 0.55); ctx.setLineDash([5,4]); ctx.lineWidth = on ? 2.6 : 1.4; ctx.stroke(); ctx.setLineDash([]);

function drawClimogram(x, y, w, h, key, hideTitle){
  const d = CLIMO[key], st = climoStats(d);
  ctx.fillStyle = '#f8fafc'; roundRect(x, y, w, h, 10); ctx.fill();

  drawLabel(hideTitle ? 'Que clima é este?' : d.climN, x + w/2, y + 40, { size: 12, color:'#475569', align:'center', bold:false });
  drawLabel('P (mm)', px - 8, py - 12, { size: 11, color:'#0f172a', align:'right' }); drawLabel('T (°C)', px + pw + 8, py - 12, { size: 11, color:'#0f172a' });
  const pY = v => py + ph - v/d.pmax*ph, tY = v => py + ph - v/d.tmax*ph;
  const nT = d.tmax/5;
  ctx.setLineDash([5,4]); ctx.strokeStyle = 'rgba(15,23,42,.55)'; ctx.lineWidth = 1;
  for (let i=0; i<=nT; i++){ const yy = py + ph - i/nT*ph; ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + pw, yy); ctx.stroke(); drawLabel(String(i*5), px + pw + 8, yy + 4, { size: 10, color:'#334155', bold:false }); }
  for (let i=0; i<=12; i++){ const xx = px + i/12*pw; ctx.beginPath(); ctx.moveTo(xx, py); ctx.lineTo(xx, py + ph); ctx.stroke(); }
  ctx.setLineDash([]);
  for (let v = 0; v <= d.pmax; v += 100) drawLabel(String(v), px - 8, pY(v) + 4, { size: 10, color:'#334155', align:'right', bold:false });
  const bw = pw/12;
  d.P.forEach((v, i) => {
    const hov = MC.hoverM === i;
    ctx.fillStyle = hov ? '#0369a1' : '#0ea5e9'; ctx.fillRect(px + i*bw + 1, pY(v), bw - 1, py + ph - pY(v));
    drawLabel('JFMAMJJASOND'[i], px + i*bw + bw/2, py + ph + 16, { size: 11, color:'#0f172a', align:'center' });
  });
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.beginPath();
  d.T.forEach((v, i) => { const xx = px + i*bw + bw/2, yy = tY(v); if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy); }); ctx.stroke();
  d.T.forEach((v, i) => { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(px + i*bw + bw/2, tY(v), 3, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = '#0ea5e9'; ctx.fillRect(px, y + h - 38, 16, 10); drawLabel('Pluviosidade média', px + 22, y + h - 29, { size: 10.5, color:'#0f172a', bold:false });
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px + 160, y + h - 24); ctx.lineTo(px + 176, y + h - 24); ctx.stroke(); drawLabel('Temperatura média', px + 182, y + h - 20, { size: 10.5, color:'#0f172a', bold:false });
  MC_GEOM = { px, py, pw, ph, bw };
  if (MC.hoverM >= 0){
    const i = MC.hoverM, tx = clamp(px + i*bw + bw/2 - 60, x + 6, x + w - 126);
    ctx.fillStyle = 'rgba(15,23,42,.92)'; roundRect(tx, py + 6, 120, 44, 6); ctx.fill();
    drawLabel('JFMAMJJASOND'[i] + ' — mês ' + (i + 1), tx + 8, py + 22, { size: 10.5, color:'#e2e8f0' });
    drawLabel('≈ ' + d.P[i] + ' mm · ' + d.T[i].toFixed(1) + ' °C', tx + 8, py + 40, { size: 11.5, color:'#fde047' });
  }
  return st;
}

function drawClimo(){
  drawModuleBg();
  drawTitle('Climas do Brasil e climogramas', 'Chuva (barras) e temperatura (linha) por mês — págs. 42–43');
  const r = brRect(18, 62, W*0.42, H - 100);
  const proj = drawBrazilBase(r, { oceans:false });
  ctx.save(); roundRect(r.x, r.y, r.w, r.h, 10); ctx.clip();
  BR_CLIMATES.forEach(c => { polyFill(c.P, proj, c.col, 'rgba(15,23,42,.35)', 1); });
  const cur = MC.mode === 'explorar' ? CLIMO[MC.sel] : (MC.answer ? CLIMO[MC.target] : null);
  if (cur){ const c = BR_CLIMATES.find(z => z.id === cur.clim); if (c){ polyPath(c.P, proj); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.stroke(); } }
  const hatch = (P, col) => {
    polyPath(P, proj); ctx.save(); ctx.clip();
    const xs = P.map(q => proj(q[0], q[1])[0]), ys = P.map(q => proj(q[0], q[1])[1]);
    const x0 = Math.min.apply(null, xs) - 10, x1 = Math.max.apply(null, xs) + 10, y0 = Math.min.apply(null, ys) - 10, y1 = Math.max.apply(null, ys) + 10;
    ctx.strokeStyle = col; ctx.lineWidth = 2.4;
    for (let d = -(y1 - y0); d < (x1 - x0); d += 9){ ctx.beginPath(); ctx.moveTo(x0 + d, y0); ctx.lineTo(x0 + d + (y1 - y0), y1); ctx.stroke(); }
    ctx.restore();
    polyPath(P, proj); ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.stroke();
  };
  if (MC.secas) hatch(BR_SECAS, 'rgba(253,224,71,.95)');
  if (MC.geada) hatch(BR_GEADA, 'rgba(196,181,253,.95)');
  ctx.restore();
  MC_GEOM_MAP = { proj, r };
  // cidades
  BR_CITIES.forEach(c => {
    const q = proj(c.lon, c.lat), key = CLIMO_ORDER.find(k => CLIMO[k].n === c.n);
    const selC = MC.mode === 'explorar' ? key === MC.sel : (MC.answer && key === MC.target);
    ctx.fillStyle = selC ? '#fde047' : '#0f172a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(q[0], q[1], selC ? 8 + Math.sin(time*4)*1.5 : 5.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    if (MC.mode === 'explorar' || MC.answer) drawLabel(c.n, q[0] + 10, q[1] + 4, { size: 10.5, color:'#fff', bg:'rgba(15,23,42,.72)', pad:3 });
  });
  // legenda do mapa
  const items = [['Equatorial úmido','#f4a6c8'],['Litorâneo úmido','#fde047'],['Tropical','#f4d9c6'],['Tropical semiárido','#fb923c'],['Tropical de altitude','#a3d977'],['Subtropical úmido','#6b8f6b']];
  const lx = r.x + 10, ly = r.y + r.h - 8 - items.length*17;
  ctx.fillStyle = 'rgba(15,23,42,.82)'; roundRect(lx - 6, ly - 14, 160, items.length*17 + 12, 6); ctx.fill();
  items.forEach((it, i) => { ctx.fillStyle = it[1]; ctx.fillRect(lx, ly + i*17 - 8, 14, 11); drawLabel(it[0], lx + 20, ly + i*17 + 2, { size: 10.5, bold:false }); });
  noteTag('Mapa esquemático “climas segundo Strahler” (pág. 43).', r.x, r.y + r.h + 16);

  // climograma
  const gx = W*0.47, gy0 = 70, gw = W - gx - 18, gh = Math.min(430, H - 260);
  const key = MC.mode === 'explorar' ? MC.sel : MC.target;
  const st = drawClimogram(gx, gy0, gw, gh, key, MC.mode === 'desafio' && !MC.answer);
  // estatísticas
  const sy = gy0 + gh + 14;
  ctx.fillStyle = 'rgba(15,23,42,.8)'; roundRect(gx, sy, gw, 104, 10); ctx.fill();
  const box = (i, lab, val, col, sub) => { const bx = gx + 16 + i*(gw - 32)/4; drawLabel(lab, bx, sy + 24, { size: 10.5, color:'#94a3b8', bold:false });
    drawLabel(val, bx, sy + 48, { size: 17, color:col }); if (sub) drawLabel(sub, bx, sy + 66, { size: 9.5, color:'#94a3b8', bold:false }); };
  box(0, 'Chuva total (≈)', Math.round(st.tot).toLocaleString('pt-BR') + ' mm', '#38bdf8');
  box(1, 'Temp. média (≈)', st.tm.toFixed(1) + ' °C', '#f87171');
  box(2, 'Amplitude (≈)', st.amp.toFixed(1) + ' °C', '#fbbf24');
  box(3, 'Meses < 60 mm', String(st.dryN), '#a3e635', st.dryN ? st.dry.join(' ') : '—');
  drawLabel('Valores lidos dos gráficos do livro — aproximados. Passe o mouse sobre as barras.', gx + 16, sy + 88, { size: 10.5, color:'#94a3b8', bold:false });
}
let MC_GEOM_MAP = null;
function climoMove(x, y){
  MC.hoverM = -1;
  if (MC_GEOM && x >= MC_GEOM.px && x <= MC_GEOM.px + MC_GEOM.pw && y >= MC_GEOM.py && y <= MC_GEOM.py + MC_GEOM.ph) MC.hoverM = clamp(Math.floor((x - MC_GEOM.px)/MC_GEOM.bw), 0, 11);
}
function climoDown(x, y){
  if (MC.mode !== 'explorar' || !MC_GEOM_MAP) return;
  let best = null, bd = 16;
  BR_CITIES.forEach(c => { const q = MC_GEOM_MAP.proj(c.lon, c.lat), d = Math.hypot(q[0] - x, q[1] - y); if (d < bd){ bd = d; best = CLIMO_ORDER.find(k => CLIMO[k].n === c.n); } });
  if (best){ MC.sel = best; buildClimo($('sidePanel')); }
}

    ctx.fillStyle = hov ? rgbaS(hexToRgb2(n.col), 0.95) : rgbaS(hexToRgb2(n.col), 0.78);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = hov ? 2.4 : 1.4;
    roundRect(q[0] - w/2, q[1] - h/2, w, h, 12); ctx.fill(); ctx.stroke();
    lines.forEach((l, i) => drawLabel(l, q[0], q[1] - h/2 + 20 + i*16, { size: n.big ? 13 : 11.5, color:'#0f172a', align:'center' }));
    n._box = { x:q[0] - w/2, y:q[1] - h/2, w, h };
  });
  if (SYN.hoverNode){
    const n = SYN_NODES.find(x => x.id === SYN.hoverNode);
    drawLabel('Clique para fixar e ver o resumo no painel.', n._box.x + n._box.w/2, n._box.y + n._box.h + 18, { size: 10.5, color:'#94a3b8', align:'center', bold:false });
  }
  noteTag('Mapa conceitual da Unidade 3 (págs. 33–44). Setas indicam “leva a” / “explica”.', 18, H - 14);
}
function hexToRgb2(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function synPick(x, y){
  let found = null;
  SYN_NODES.forEach(n => { const b = n._box; if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) found = n.id; });
  return found;
}
function synMove(x, y){ if (SYN.scene === 'mapa') SYN.hoverNode = synPick(x, y); }
function synDown(x, y){
  if (SYN.scene !== 'mapa') return;
  const id = synPick(x, y); if (!id) return;
  SYN.hoverNode = id;
  const el = $('synNodeInfo');
  const mod = SYN_LINK[id];
  if (el) el.innerHTML = '<b>' + SYN_NODES.find(n => n.id === id).label.replace(/\n/g, ' ') + '</b><br>' + SYN_INFO[id] +
    (mod ? '<br><button class="full" id="synGo" style="margin-top:8px">Abrir aba relacionada →</button>' : '');
  if ($('synGo')) $('synGo').onclick = () => { setMode(mod); };
}

function drawSyn(){
  drawModuleBg();
  if (SYN.scene === 'mapa'){ drawTitle('Mapa conceitual: tempo, clima e seus fatores', 'Toda a Unidade 3 em um esquema — págs. 34–44'); drawSynMap(); }
  else {
    drawTitle('Exercícios "Faça em sala"', 'Questões 1, 2, 3 e 4 — pág. 44');
    ctx.save();
    drawLabel('Use o painel à direita para ler o enunciado, pensar na resposta e depois conferir o comentário.', 20, 72, { size: 12, color:'#cbd5e1', bold:false });
    const EX = SYN_EXERCISES[SYN.ex];
    drawLabel('Questão ' + SYN.ex + ' — ' + EX.title, 20, 100, { size: 15, color:'#fda4af' });
    // pequenas ilustrações de apoio por questão
    const iy = 160;
    if (SYN.ex === 1){ cloudCumulus(160, iy, 30); drawSun(320, iy - 10); drawLabel('previsão do tempo → decisões no campo', 20, iy + 70, { size: 11, color:'#94a3b8', bold:false }); }
    else if (SYN.ex === 2){ drawLabel('🌾 setor primário depende diretamente do tempo', 20, iy, { size: 12, color:'#a3e635', bold:false }); drawLabel('🏭 tecnologia e infraestrutura reduzem a vulnerabilidade', 20, iy + 24, { size: 12, color:'#7dd3fc', bold:false }); }
    else if (SYN.ex === 3){ arrowLine(140, iy, 260, iy, '#fb923c', 3, 7); drawLabel('inverno: continente → oceano', 140, iy + 20, { size: 10.5, bold:false }); arrowLine(260, iy + 46, 140, iy + 46, '#7dd3fc', 3, 7); drawLabel('verão: oceano → continente', 140, iy + 66, { size: 10.5, bold:false }); }
    else { cloudCumulus(140, iy, 22); cloudCumulus(210, iy - 8, 18); drawLabel('menos floresta → menos evapotranspiração → chuva se desloca', 20, iy + 60, { size: 11, color:'#94a3b8', bold:false }); }
    ctx.restore();
  }
}
MODS.sintese = { build: buildSyn, draw: drawSyn, move: synMove, down: synDown };


/* ============ READOUTS ============ */
function updateReadouts(){
  if (currentMode !== 'estrutura') return;
  if ($('tempVal')) $('tempVal').innerText = state.temp + ' °C';
  if ($('humidVal')) $('humidVal').innerText = state.humid + ' %';
  if ($('altVal')) $('altVal').innerText = fmtKm(state.alt);
  if ($('solarVal')) $('solarVal').innerText = Math.round(radState.solar) + ' W/m²';
  if ($('albedoVal')) $('albedoVal').innerText = radState.albedo.toFixed(1) + ' %';
  if ($('ghVal')) $('ghVal').innerText = radState.gh + ' ×';

  const t = tempAt(state.alt);
  if ($('tLayer')) $('tLayer').innerText = layerAt(state.alt);
  if ($('tTemp')) $('tTemp').innerText = t.toFixed(1) + ' °C';
  if ($('tPress')) $('tPress').innerText = fmtSmart(pressureAt(state.alt)) + ' hPa';
  if ($('tDens')) $('tDens').innerText = fmtSmart(densityPctAt(state.alt)) + ' %';

  if ($('humidReadout')){
    const sat = satDensity(state.temp), vap = sat*state.humid/100;
    $('humidReadout').innerHTML =
      'Vapor de água (umidade absoluta): <b>' + vap.toFixed(1) + ' g/m³</b> · saturação a ' + state.temp +
      ' °C: <b>' + sat.toFixed(1) + ' g/m³</b> → UR = <b>' + state.humid + ' %</b>.<br>' +
      (state.humid >= 100 ? '<b>Ar saturado: ocorre precipitação.</b>' : 'Ar não saturado: sem precipitação.');
  }

  if ($('radReadout')){
    const R = radBudget(), f = v => Math.round(v);
    const netTxt = (f(R.net) > 0 ? '+' : '') + f(R.net);
    $('radReadout').innerHTML =
      '☀️ Incidente: <b>' + f(R.S) + ' W/m²</b><br>' +
      '⚪ Refletida: <b>' + f(R.refl) + '</b> (nuvens/atmosfera ' + f(R.reflAtm) + ' + superfície ' + f(R.reflSup) + ')<br>' +
      '🟡 Absorvida pela atmosfera: <b>' + f(R.absAtm) + '</b><br>' +
      '🟡 Absorvida pela superfície: <b>' + f(R.absSup) + '</b><br>' +
      '🔴 Emitida pela superfície (' + f(R.Tc) + ' °C): <b>' + f(R.Es) + '</b><br>' +
      '🟠 Radiação de retorno: <b>' + f(R.back) + '</b><br>' +
      '🪟 Janela atmosférica: <b>' + f(R.win) + '</b> · 💧 calor latente: <b>' + f(R.latent) + '</b> · 🌡️ sensível: <b>' + f(R.sens) + '</b><br>' +
      '🌍 Onda longa ao espaço: <b>' + f(R.olr) + '</b><br>' +
      '⚖️ Saldo: <b>' + netTxt + ' W/m²</b><br>' +
      '<span style="color:#64748b">≈ 0: equilíbrio · &gt; 0: aquece · &lt; 0: esfria.<br>Os valores do padrão são os da figura (pág. 36); a resposta aos controles é ilustrativa (qualitativa), maior que a variação real.</span>';
  }

  if ($('cloudReadout')){
    const tipo = resolveCloud();
    const descs = {
      none:'Umidade baixa: ar seco, <b>céu limpo</b> (sem nuvens).',
      all:'Mostrando <b>todos os 10 gêneros</b> da pág. 35 nas suas faixas de altitude.',
      cirrus:'Nuvens <b>altas</b> (7–13 km). Finas, cristais de gelo.',
      cirrocumulus:'Nuvens <b>altas</b>. "Céu peixinho", flocos brancos.',
      cirrostratus:'Nuvens <b>altas</b>. Véu fino, produz halo solar.',
      altocumulus:'Nuvens <b>médias</b> (2–7 km). Flocos arredondados.',
      altostratus:'Nuvens <b>médias</b>. Camada cinza, sol velado.',
      stratocumulus:'Nuvens <b>baixas</b> (0-2 km). Rolos cinzentos.',
      stratus:'Nuvens <b>baixas</b>. Camada contínua, nevoeiro elevado.',
      nimbostratus:'Nuvem espessa entre as faixas <b>baixa e média</b> (na figura da pág. 35 cruza a linha de 2 000 m). Chuva contínua e leve.',
      cumulus:'<b>Desenvolvimento vertical</b>. Algodão, bom tempo.',
      cumulonimbus:'<b>Desenvolvimento vertical</b>. Tempestade, raios, granizo.'
    };
    let txt = descs[tipo] || descs.cirrus;
    if (state.cloudSel === 'auto') txt += ' <span style="color:#64748b">(automático: UR ' + state.humid + ' %' + (state.humid >= 100 ? ' = saturação → precipitação' : '') + ')</span>';
    $('cloudReadout').innerHTML = txt;
  }
  syncZoomUI();
}

function loop(){
  time += 0.03;
  ctx.clearRect(0, 0, W, H);
  if (currentMode === 'estrutura'){
    drawEstrutura();
  } else if (MODS[currentMode]){
    ctx.save(); MODS[currentMode].draw(); ctx.restore();
    ctx.textAlign = 'left'; ctx.globalAlpha = 1; ctx.setLineDash([]);
  } else {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 16px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText('Módulo em desenvolvimento', W/2, H/2); ctx.textAlign = 'left';
  }
  requestAnimationFrame(loop);
}

window.addEventListener('load', ()=>{
  buildNav();
  buildPanel();
  buildLegend();
  resizeCanvas();                       // depois do menu: o cabeçalho já tem a altura final
  if (window.ResizeObserver) new ResizeObserver(()=>resizeCanvas()).observe(canvas.parentElement);
  syncZoomUI();
  loop();
});
window.addEventListener('resize', ()=>{ resizeCanvas(); });
</script>
</body>
