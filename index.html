<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Geológico e Ecológico 3D - Leve (WebGL 2.0)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #c9d1d9; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        #ui-panel {
            position: absolute; top: 12px; left: 12px; width: 320px;
            background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(48, 54, 61, 0.8); border-radius: 8px;
            padding: 16px; font-size: 13px; max-height: calc(100vh - 24px); overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { font-size: 15px; color: #58a6ff; margin-bottom: 12px; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
        .control-group { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 500; }
        span.val { color: #8b949e; }
        input[type=range] { width: 100%; accent-color: #1f6feb; cursor: pointer; }
        .btn-group { display: flex; gap: 8px; margin-top: 14px; }
        button {
            flex: 1; padding: 8px 12px; background: #238636; border: none; border-radius: 6px;
            color: #ffffff; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #2ea043; }
        button.btn-danger { background: #da3633; }
        button.btn-danger:hover { background: #f85149; }
        button.btn-sec { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
        button.btn-sec:hover { background: #30363d; }
        #stats { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 11px; }
    </style>
    <!-- Carregamento das bibliotecas Three.js e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>Simulador Geológico 3D</h2>
        
        <div class="control-group">
            <label>Resolução da Grelha: <span id="res-val" class="val">128 x 128</span></label>
            <input type="range" id="sim-res" min="64" max="256" step="64" value="128">
        </div>

        <div class="control-group">
            <label>Intensidade da Chuva: <span id="rain-val" class="val">0.010</span></label>
            <input type="range" id="rain-rate" min="0" max="0.05" step="0.001" value="0.01">
        </div>

        <div class="control-group">
            <label>Erodibilidade do Solo: <span id="eros-val" class="val">0.020</span></label>
            <input type="range" id="eros-rate" min="0.001" max="0.1" step="0.001" value="0.02">
        </div>

        <div class="control-group">
            <label>Taxa de Deposição: <span id="dep-val" class="val">0.020</span></label>
            <input type="range" id="dep-rate" min="0.001" max="0.1" step="0.001" value="0.02">
        </div>

        <div class="control-group">
            <label>Evaporação: <span id="evap-val" class="val">0.015</span></label>
            <input type="range" id="evap-rate" min="0.001" max="0.05" step="0.001" value="0.015">
        </div>

        <div class="control-group">
            <label>Ângulo de Repouso (Térmico): <span id="angle-val" class="val">35°</span></label>
            <input type="range" id="thermal-angle" min="10" max="60" step="1" value="35">
        </div>

        <div class="control-group">
            <label>Soerguimento Tectônico: <span id="uplift-val" class="val">0.000</span></label>
            <input type="range" id="uplift-rate" min="0" max="0.005" step="0.0005" value="0">
        </div>

        <div class="btn-group">
            <button id="btn-toggle">Pausar</button>
            <button id="btn-reset" class="btn-danger">Reiniciar</button>
        </div>
        <div class="btn-group">
            <button id="btn-wireframe" class="btn-sec">Modo Aramado</button>
        </div>
    </div>

    <div id="stats">FPS: <span id="fps">60</span> | Células: <span id="cell-count">16384</span></div>

    <script>
        // --- CÓDIGO GLSL DOS SHADERS GPGPU (WebGL 2.0) ---

        // 1. Pass-Through Vertex Shader
        const quadVertexShader = `#version 300 es
        in vec2 position;
        out vec2 vUv;
        void main() {
            vUv = position * 0.5 + 0.5;
            gl_Position = vec4(position, 0.0, 1.0);
        }`;

        // 2. Shader de Inicialização do Terreno (Ruído Fractal Simplex)
        const initTerrainShader = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 fragColor;

        vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
        float snoise(vec2 v){
            const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                               -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1;
            i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
            + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ;
            m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        float fbm(vec2 p) {
            float val = 0.0;
            float amp = 0.5;
            for(int i=0; i<5; i++) {
                val += amp * snoise(p);
                p *= 2.02;
                amp *= 0.5;
            }
            return val;
        }

        void main() {
            vec2 st = vUv * 3.0;
            float h = fbm(st) * 0.5 + 0.5;
            h = pow(h, 1.8); // Vales mais pronunciados
            
            float bedrock = h * 0.8;
            float regolith = h * 0.2;
            float water = 0.0;
            float sediment = 0.0;

            fragColor = vec4(bedrock, regolith, water, sediment);
        }`;

        // 3. Shader de Hidrodinâmica e Outflow Flux (Águas Rasas)
        const fluxShader = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uTerrain;
        uniform sampler2D uFlux;
        uniform vec2 uTexelSize;
        uniform float uRainRate;
        uniform float uDeltaTime;
        out vec4 fragColor;

        void main() {
            vec4 t = texture(uTerrain, vUv);
            float b = t.r;
            float r = t.g;
            float d = t.b + uRainRate * uDeltaTime; // Adiciona chuva
            float hCenter = b + r + d;

            vec4 flux = texture(uFlux, vUv);

            float hL = texture(uTerrain, vUv + vec2(-uTexelSize.x, 0.0)).r + texture(uTerrain, vUv + vec2(-uTexelSize.x, 0.0)).g + texture(uTerrain, vUv + vec2(-uTexelSize.x, 0.0)).b;
            float hR = texture(uTerrain, vUv + vec2( uTexelSize.x, 0.0)).r + texture(uTerrain, vUv + vec2( uTexelSize.x, 0.0)).g + texture(uTerrain, vUv + vec2( uTexelSize.x, 0.0)).b;
            float hT = texture(uTerrain, vUv + vec2(0.0,  uTexelSize.y)).r + texture(uTerrain, vUv + vec2(0.0,  uTexelSize.y)).g + texture(uTerrain, vUv + vec2(0.0,  uTexelSize.y)).b;
            float hB = texture(uTerrain, vUv + vec2(0.0, -uTexelSize.y)).r + texture(uTerrain, vUv + vec2(0.0, -uTexelSize.y)).g + texture(uTerrain, vUv + vec2(0.0, -uTexelSize.y)).b;

            float g = 9.81;
            float pipeArea = 1.0;
            float pipeLen = 1.0;
            float factor = uDeltaTime * pipeArea * g / pipeLen;

            float fL = max(0.0, flux.r + factor * (hCenter - hL));
            float fR = max(0.0, flux.g + factor * (hCenter - hR));
            float fT = max(0.0, flux.b + factor * (hCenter - hT));
            float fB = max(0.0, flux.a + factor * (hCenter - hB));

            float totalFlux = (fL + fR + fT + fB) * uDeltaTime;
            if (totalFlux > 0.0) {
                float scale = min(1.0, (d * 1.0) / totalFlux);
                fL *= scale; fR *= scale; fT *= scale; fB *= scale;
            }

            fragColor = vec4(fL, fR, fT, fB);
        }`;

        // 4. Shader de Erosão e Deposição Hidráulica
        const erosionShader = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uTerrain;
        uniform sampler2D uFlux;
        uniform vec2 uTexelSize;
        uniform float uDeltaTime;
        uniform float uErosRate;
        uniform float uDepRate;
        uniform float uEvapRate;
        uniform float uUpliftRate;
        out vec4 fragColor;

        void main() {
            vec4 t = texture(uTerrain, vUv);
            vec4 f = texture(uFlux, vUv);

            float fInL = texture(uFlux, vUv + vec2(-uTexelSize.x, 0.0)).g;
            float fInR = texture(uFlux, vUv + vec2( uTexelSize.x, 0.0)).r;
            float fInT = texture(uFlux, vUv + vec2(0.0,  uTexelSize.y)).a;
            float fInB = texture(uFlux, vUv + vec2(0.0, -uTexelSize.y)).b;

            float netVolume = (fInL + fInR + fInT + fInB - (f.r + f.g + f.b + f.a)) * uDeltaTime;
            float dNew = max(0.0, t.b + netVolume);

            // Vetor velocidade do fluxo
            float u = (fInL - f.r + f.g - fInR) * 0.5;
            float v = (fInB - f.a + f.b - fInT) * 0.5;
            float vel = length(vec2(u, v));

            // Gradiente/Declividade local
            float hL = texture(uTerrain, vUv + vec2(-uTexelSize.x, 0.0)).r + texture(uTerrain, vUv + vec2(-uTexelSize.x, 0.0)).g;
            float hR = texture(uTerrain, vUv + vec2( uTexelSize.x, 0.0)).r + texture(uTerrain, vUv + vec2( uTexelSize.x, 0.0)).g;
            float hT = texture(uTerrain, vUv + vec2(0.0,  uTexelSize.y)).r + texture(uTerrain, vUv + vec2(0.0,  uTexelSize.y)).g;
            float hB = texture(uTerrain, vUv + vec2(0.0, -uTexelSize.y)).r + texture(uTerrain, vUv + vec2(0.0, -uTexelSize.y)).g;
            float slope = length(vec2(hR - hL, hT - hB));

            // Capacidade de transporte de sedimento
            float capacity = max(0.0, vel * sin(atan(slope)) * min(dNew, 1.0));
            
            float regolith = t.g;
            float sediment = t.a;
            float bedrock = t.r + uUpliftRate * uDeltaTime; // Soerguimento endógeno

            if (capacity > sediment) {
                float eroded = uErosRate * (capacity - sediment);
                float actualEroded = min(eroded, regolith);
                regolith -= actualEroded;
                sediment += actualEroded;
            } else {
                float deposited = uDepRate * (sediment - capacity);
                regolith += deposited;
                sediment -= deposited;
            }

            // Evaporação
            dNew *= (1.0 - uEvapRate * uDeltaTime);

            fragColor = vec4(bedrock, max(0.0, regolith), max(0.0, dNew), max(0.0, sediment));
        }`;

        // 5. Shader de Desmoronamento Térmico (Ângulo de Repouso)
        const thermalShader = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uTerrain;
        uniform vec2 uTexelSize;
        uniform float uMaxSlope;
        out vec4 fragColor;

        void main() {
            vec4 t = texture(uTerrain, vUv);
            float hCell = t.r + t.g;

            vec2 offsets[4] = vec2[](
                vec2(-uTexelSize.x, 0.0), vec2(uTexelSize.x, 0.0),
                vec2(0.0, uTexelSize.y), vec2(0.0, -uTexelSize.y)
            );

            float maxDiff = 0.0;
            for(int i=0; i<4; i++) {
                vec4 n = texture(uTerrain, vUv + offsets[i]);
                float hN = n.r + n.g;
                float diff = hCell - hN;
                if(diff > maxDiff) maxDiff = diff;
            }

            float regolith = t.g;
            if (maxDiff > uMaxSlope && regolith > 0.0) {
                float move = 0.5 * (maxDiff - uMaxSlope);
                regolith -= min(move, regolith);
            }

            fragColor = vec4(t.r, max(0.0, regolith), t.b, t.a);
        }`;

        // 6. Shader de Renderização 3D do Terreno (Vertex + Fragment com Biomas)
        const terrainRenderVS = `#version 300 es
        precision highp float;
        uniform sampler2D uTerrain;
        uniform vec2 uTexelSize;
        out vec2 vUv;
        out vec3 vNormal;
        out vec3 vWorldPos;
        out vec4 vTerrainData;

        void main() {
            vUv = uv;
            vec4 data = texture(uTerrain, uv);
            vTerrainData = data;

            float totalHeight = data.r + data.g + data.b;
            vec3 pos = position;
            pos.z = totalHeight * 40.0; // Escala de altura 3D

            // Cálculo das normais diretamente no Vertex Shader
            float hL = texture(uTerrain, uv + vec2(-uTexelSize.x, 0.0)).r + texture(uTerrain, uv + vec2(-uTexelSize.x, 0.0)).g + texture(uTerrain, uv + vec2(-uTexelSize.x, 0.0)).b;
            float hR = texture(uTerrain, uv + vec2( uTexelSize.x, 0.0)).r + texture(uTerrain, uv + vec2( uTexelSize.x, 0.0)).g + texture(uTerrain, uv + vec2( uTexelSize.x, 0.0)).b;
            float hB = texture(uTerrain, uv + vec2(0.0, -uTexelSize.y)).r + texture(uTerrain, uv + vec2(0.0, -uTexelSize.y)).g + texture(uTerrain, uv + vec2(0.0, -uTexelSize.y)).b;
            float hT = texture(uTerrain, uv + vec2(0.0,  uTexelSize.y)).r + texture(uTerrain, uv + vec2(0.0,  uTexelSize.y)).g + texture(uTerrain, uv + vec2(0.0,  uTexelSize.y)).b;

            vec3 normal = normalize(vec3((hL - hR) * 40.0, (hB - hT) * 40.0, 2.0));
            vNormal = normalMatrix * normal;

            vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
            vWorldPos = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }`;

        const terrainRenderFS = `#version 300 es
        precision highp float;
        in vec2 vUv;
        in vec3 vNormal;
        in vec3 vWorldPos;
        in vec4 vTerrainData;

        out vec4 fragColor;

        void main() {
            float bedrock = vTerrainData.r;
            float regolith = vTerrainData.g;
            float water = vTerrainData.b;

            vec3 N = normalize(vNormal);
            vec3 L = normalize(vec3(0.5, 0.8, 1.0)); // Luz solar
            float diff = max(dot(N, L), 0.2);

            float slope = 1.0 - N.z; // Inclinação
            float alt = vWorldPos.z;

            // Cores do Terreno / Biomas
            vec3 cBedrock = vec3(0.35, 0.32, 0.30); // Rocha Cinza
            vec3 cRegolith = vec3(0.70, 0.55, 0.35); // Areia/Sedimento
            vec3 cGrass = vec3(0.20, 0.55, 0.15); // Vegetação/Grama
            vec3 cSnow = vec3(0.95, 0.95, 0.98); // Neve em topo
            vec3 cWater = vec3(0.05, 0.45, 0.85); // Água Fluindo

            // Zoneamento Ecológico Dinâmico
            vec3 landColor = mix(cGrass, cRegolith, smoothstep(0.05, 0.2, regolith));
            if (slope > 0.4) landColor = cBedrock;
            if (alt > 25.0) landColor = mix(landColor, cSnow, smoothstep(25.0, 32.0, alt));

            vec3 finalColor = landColor * diff;

            // Renderização da Lâmina d'Água
            if (water > 0.001) {
                float waterAlpha = smoothstep(0.0, 0.1, water) * 0.75;
                finalColor = mix(finalColor, cWater * (diff + 0.3), waterAlpha);
            }

            fragColor = vec4(finalColor, 1.0);
        }`;

        // --- ENGINES E GERENCIAMENTO DE GPU / THREE.JS ---

        let scene, camera, renderer, controls;
        let simMesh, terrainMesh, terrainGeo, terrainMat;
        let simRes = 128;
        let isRunning = true;

        let fboTerrainA, fboTerrainB, fboFluxA, fboFluxB;
        let fluxMaterial, erosionMaterial, thermalMaterial;

        const clock = new THREE.Clock();

        function createFBO(res) {
            return new THREE.WebGLRenderTarget(res, res, {
                minFilter: THREE.NearestFilter,
                magFilter: THREE.NearestFilter,
                format: THREE.RGBAFormat,
                type: THREE.FloatType,
                depthBuffer: false,
                stencilBuffer: false
            });
        }

        function initApp() {
            const container = document.getElementById('canvas-container');

            // 1. Cena Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d1117);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -90, 70);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // 2. Inicialização dos FBOs Ping-Pong
            setupSimulation();

            // 3. Criar Malha 3D Visível do Terreno
            terrainGeo = new THREE.PlaneBufferGeometry(100, 100, simRes - 1, simRes - 1);
            terrainMat = new THREE.ShaderMaterial({
                vertexShader: terrainRenderVS,
                fragmentShader: terrainRenderFS,
                uniforms: {
                    uTerrain: { value: fboTerrainA.texture },
                    uTexelSize: { value: new THREE.Vector2(1 / simRes, 1 / simRes) }
                },
                wireframe: false
            });

            terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
            scene.add(terrainMesh);

            // Light Ambient Helper
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Resize Event
            window.addEventListener('resize', onWindowResize);

            // Bind de Eventos UI
            setupUI();

            // Loop de Renderização
            animate();
        }

        function setupSimulation() {
            fboTerrainA = createFBO(simRes);
            fboTerrainB = createFBO(simRes);
            fboFluxA = createFBO(simRes);
            fboFluxB = createFBO(simRes);

            // Cena Ortográfica Invisível para Processamento GPGPU
            const simScene = new THREE.Scene();
            const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const simGeo = new THREE.PlaneBufferGeometry(2, 2);

            // Material 1: Inicialização
            const initMat = new THREE.ShaderMaterial({
                vertexShader: quadVertexShader,
                fragmentShader: initTerrainShader
            });
            simMesh = new THREE.Mesh(simGeo, initMat);
            simScene.add(simMesh);

            // Executa Pass de Inicialização do Terreno
            renderer.setRenderTarget(fboTerrainA);
            renderer.render(simScene, simCam);
            renderer.setRenderTarget(fboTerrainB);
            renderer.render(simScene, simCam);
            renderer.setRenderTarget(null);

            // Materiais de Simulação
            const texel = new THREE.Vector2(1 / simRes, 1 / simRes);

            fluxMaterial = new THREE.ShaderMaterial({
                vertexShader: quadVertexShader,
                fragmentShader: fluxShader,
                uniforms: {
                    uTerrain: { value: null },
                    uFlux: { value: null },
                    uTexelSize: { value: texel },
                    uRainRate: { value: 0.01 },
                    uDeltaTime: { value: 0.016 }
                }
            });

            erosionMaterial = new THREE.ShaderMaterial({
                vertexShader: quadVertexShader,
                fragmentShader: erosionShader,
                uniforms: {
                    uTerrain: { value: null },
                    uFlux: { value: null },
                    uTexelSize: { value: texel },
                    uDeltaTime: { value: 0.016 },
                    uErosRate: { value: 0.02 },
                    uDepRate: { value: 0.02 },
                    uEvapRate: { value: 0.015 },
                    uUpliftRate: { value: 0.0 }
                }
            });

            thermalMaterial = new THREE.ShaderMaterial({
                vertexShader: quadVertexShader,
                fragmentShader: thermalShader,
                uniforms: {
                    uTerrain: { value: null },
                    uTexelSize: { value: texel },
                    uMaxSlope: { value: Math.tan(35 * Math.PI / 180) * (1 / simRes) }
                }
            });
        }

        function stepSimulation(dt) {
            if (!isRunning) return;

            const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const simScene = new THREE.Scene();
            const simGeo = new THREE.PlaneBufferGeometry(2, 2);
            const quad = new THREE.Mesh(simGeo, fluxMaterial);
            simScene.add(quad);

            // Passo A: Hidrodinâmica e Fluxo
            fluxMaterial.uniforms.uTerrain.value = fboTerrainA.texture;
            fluxMaterial.uniforms.uFlux.value = fboFluxA.texture;
            fluxMaterial.uniforms.uDeltaTime.value = dt;
            renderer.setRenderTarget(fboFluxB);
            renderer.render(simScene, simCam);

            // Passo B: Erosão e Deposição
            quad.material = erosionMaterial;
            erosionMaterial.uniforms.uTerrain.value = fboTerrainA.texture;
            erosionMaterial.uniforms.uFlux.value = fboFluxB.texture;
            erosionMaterial.uniforms.uDeltaTime.value = dt;
            renderer.setRenderTarget(fboTerrainB);
            renderer.render(simScene, simCam);

            // Passo C: Desmoronamento Térmico
            quad.material = thermalMaterial;
            thermalMaterial.uniforms.uTerrain.value = fboTerrainB.texture;
            renderer.setRenderTarget(fboTerrainA);
            renderer.render(simScene, simCam);

            renderer.setRenderTarget(null);

            // Atualiza Uniforme de Renderização
            terrainMat.uniforms.uTerrain.value = fboTerrainA.texture;
        }

        let frameCount = 0, lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.033);
            stepSimulation(dt);

            controls.update();
            renderer.render(scene, camera);

            // Estatísticas
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                lastTime = now;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- BIND DE CONTROLES E INTERFACE DE USUÁRIO ---
        function setupUI() {
            const bindInput = (id, targetObj, key, transform = v => parseFloat(v), displayFn = null) => {
                const el = document.getElementById(id);
                el.addEventListener('input', (e) => {
                    const val = transform(e.target.value);
                    targetObj[key].value = val;
                    if (displayFn) displayFn(e.target.value);
                });
            };

            bindInput('rain-rate', fluxMaterial.uniforms, 'uRainRate', v => parseFloat(v), v => document.getElementById('rain-val').innerText = parseFloat(v).toFixed(3));
            bindInput('eros-rate', erosionMaterial.uniforms, 'uErosRate', v => parseFloat(v), v => document.getElementById('eros-val').innerText = parseFloat(v).toFixed(3));
            bindInput('dep-rate', erosionMaterial.uniforms, 'uDepRate', v => parseFloat(v), v => document.getElementById('dep-val').innerText = parseFloat(v).toFixed(3));
            bindInput('evap-rate', erosionMaterial.uniforms, 'uEvapRate', v => parseFloat(v), v => document.getElementById('evap-val').innerText = parseFloat(v).toFixed(3));
            bindInput('uplift-rate', erosionMaterial.uniforms, 'uUpliftRate', v => parseFloat(v), v => document.getElementById('uplift-val').innerText = parseFloat(v).toFixed(4));

            document.getElementById('thermal-angle').addEventListener('input', (e) => {
                const deg = parseFloat(e.target.value);
                document.getElementById('angle-val').innerText = `${deg}°`;
                thermalMaterial.uniforms.uMaxSlope.value = Math.tan(deg * Math.PI / 180) * (1 / simRes);
            });

            document.getElementById('sim-res').addEventListener('change', (e) => {
                simRes = parseInt(e.target.value);
                document.getElementById('res-val').innerText = `${simRes} x ${simRes}`;
                document.getElementById('cell-count').innerText = simRes * simRes;

                // Reconstruir geometria e FBOs
                scene.remove(terrainMesh);
                terrainGeo.dispose();
                terrainGeo = new THREE.PlaneBufferGeometry(100, 100, simRes - 1, simRes - 1);
                terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
                scene.add(terrainMesh);

                setupSimulation();
            });

            document.getElementById('btn-toggle').addEventListener('click', (e) => {
                isRunning = !isRunning;
                e.target.innerText = isRunning ? "Pausar" : "Continuar";
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                setupSimulation();
            });

            document.getElementById('btn-wireframe').addEventListener('click', () => {
                terrainMat.wireframe = !terrainMat.wireframe;
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
